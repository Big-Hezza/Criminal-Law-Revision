{t:"im", h:"Drink and diminished responsibility", s:"Drunk is not enough. Dependency can be. A real condition plus drink still works.", say:"Ordinary drunkenness cannot found the defence. Alcohol dependency can, if drinking was involuntary. If D has a real condition and was also drunk, the jury ignores the drink and asks whether the condition alone still substantially impaired D.", ex:"A depressed person who had also been drinking: set the drink aside and test the depression.", m:"Fenton no, Tandy maybe, Dietschmann yes"},
{t:"im", h:"Three kinds of involuntary manslaughter", s:"Unlawful act, gross negligence, subjective recklessness.", say:"No intent to kill or seriously hurt, but still blameworthy. UAM: a crime that is dangerous. GNM: breaching a duty so badly it is criminal. Reckless: knowing death or serious injury was highly probable and carrying on.", ex:"A shove that causes a fatal fall is UAM. A doctor who ignores a clear danger is GNM.", m:"Act, Negligence, Reckless"},
{t:"im", h:"Unlawful act manslaughter", s:"A crime that sober, reasonable people see as risky, and someone dies.", say:"Four steps: intentional act, unlawful (a real crime with its mens rea), dangerous (some physical harm risk), and causes death. You do not need to foresee death.", ex:"Pushing someone in anger, causing a fatal fall.", m:"IUDC: Intentional, Unlawful, Dangerous, Causes death"},
{t:"im", h:"What counts as ‘dangerous’?", s:"What a sober, reasonable bystander who knew what D knew would see.", say:"Ask whether that bystander would see a risk of some physical harm. If D learns during the incident that V is frail, that counts (Watson). A hidden condition D could not have known about does not make the act dangerous (Dawson).", ex:"A burglar who sees a frail old man: dangerous. A robber who cannot know the cashier has a weak heart: not by that fact.", m:"Dawson hides, Watson sees"},

{t:"im", h:"Gross negligence manslaughter", s:"Duty, breach, causation, and negligence so bad it is criminal.", say:"The jury has to think the breach was bad enough to be a crime. Duty comes from ordinary negligence law, or from creating a dangerous situation (Evans). The risk must be a serious and obvious risk of death, not just of harm.", ex:"An anaesthetist ignoring a disconnected ventilator tube (Adomako). A driver smuggling migrants in a sealed container (Wacker).", m:"D-B-C-G"},

      {t:"Positive act or omission?", d:"Your slides say assault needs a positive act, citing Santana-Bermudez. Your note points out that the case actually shows the opposite. Safest: state the slide position, then add that omission can suffice where D created the danger.", c:[
        {t:"DPP v Santana-Bermudez (2003)", k:"case", d:"D told an officer he had no needles, then the officer was pricked by one in D’s pocket. Liable because D created a danger and failed to avert it (the Miller principle)."}
      ]},
      {t:"Mens rea", d:"Intention or recklessness (Cunningham, subjective) as to causing V to apprehend immediate unlawful violence."}
    ]},
    {t:"Battery", d:"The infliction of unlawful force on another person. Intention or recklessness as to the application of unlawful force.", c:[
      {t:"Slight force is enough", c:[
        {t:"Faulkner v Talbot (1981)", k:"case", d:"The force can be very slight and no harm is needed."}
      ]},
      {t:"Everyday contact", d:"Consent is a defence to battery. Ordinary contact is impliedly consented to.", c:[
        {t:"Collins v Wilcock (1984)", k:"case", d:"Nobody can complain of jostling in a supermarket, on the underground or in a busy street, or of a friendly pat within reason. Only contact beyond generally acceptable conduct is punishable."}
      ]},
      {t:"Direct or indirect force", d:"Force can be applied indirectly, for example by throwing an object or through a medium D controls.", c:[
        {t:"Martin (1881–2)", k:"case", d:"D put out the theatre lights and put an iron bar across the exit. The audience panicked and people were seriously hurt. Convicted under s 20."},
        {t:"DPP v K (a minor) (1990)", k:"case", d:"Pupil hid sulphuric acid in a hand dryer and another pupil was burned. Guilty of s 47. Force through a medium D controls."},
        {t:"Haystead v CC of Derbyshire (2000)", k:"case", d:"D punched a woman holding a baby. She dropped the baby, who hit his head. Battery of the baby was available even though D did not touch it."}
      ]},
      {t:"Mens rea", c:[
        {t:"Venna [1975]", k:"case", d:"D kicked out while resisting arrest and broke an officer’s hand. Recklessness is enough for battery."}
      ]}
    ]},
    {t:"ABH: s 47 OAPA 1861", d:"Assault occasioning actual bodily harm. Either way, maximum 5 years.", c:[
      {t:"Actus reus: three elements", k:"key", d:"(1) The actus reus of an assault or battery. (2) Causation, both factual and legal (Roberts). (3) Actual bodily harm."},
      {t:"What is ABH?", d:"Miller (1954), Lynskey J: any hurt or injury calculated to interfere with the health or comfort of the victim.", c:[
        {t:"Chan-Fook (1994)", k:"case", d:"Psychiatric injury can be ABH if it is a clinically recognised condition. Fear, distress and panic are not enough."},
        {t:"Morris (1998)", k:"case", d:"Psychiatric ABH needs expert psychiatric evidence."},
        {t:"DPP v Smith (2006)", k:"case", d:"Cutting off a substantial amount of V’s hair without consent was ABH, even with no mark or broken skin."},
        {t:"CPS Charging Standards", k:"stat", d:"Examples of ABH: loss or breaking of teeth, temporary loss of sensory functions, extensive or multiple bruising, a broken nose, minor fractures, cuts needing stitches, and psychiatric injury."}
      ]},
      {t:"Mens rea", d:"Only the mens rea of assault or battery. No need for intention or recklessness as to the ABH.", c:[
        {t:"Savage; Parmenter", k:"case", d:"Savage meant to throw beer over V but the glass left her hand and cut V’s wrist. Lord Ackner: the prosecution need not prove D intended or was reckless about ABH."}
      ]}
    ]},
    {t:"s 20 OAPA 1861", d:"Maliciously wounding or inflicting GBH. Either way. Mens rea: intention or recklessness (malice): D must foresee some harm might result, not necessarily serious harm (Mowatt; Savage; Parmenter).", c:[
      {t:"Wounding", d:"The skin must be broken, both layers (epidermis and dermis).", c:[
        {t:"Moriarty v Brooks (1834)", k:"case", d:"The skin must be broken."},
        {t:"Beckett (1836)", k:"case", d:"A mere scratch is not enough."},
        {t:"M’Loughlin (1838)", k:"case", d:"Both layers must be broken."},
        {t:"C (a minor) v Eisenhower (1984)", k:"case", d:"A ruptured blood vessel in the eye was not a wound. Bruising and internal bleeding are not wounds."}
      ]},
      {t:"Inflicting GBH", d:"GBH is really serious harm (DPP v Smith 1961), though Saunders says ‘really’ is unnecessary so GBH means serious harm.", c:[
        {t:"DPP v Smith [1961]", k:"case", d:"GBH means really serious harm."},
        {t:"Saunders (1985)", k:"case", d:"‘Really’ is unnecessary. GBH means serious harm."},
        {t:"Wilson [1984] HL", k:"case", d:"‘Inflict’ does not require an assault. (Your notes say it is often cited as Wilson (Clarence). That is a different, 1888 case.)"},
        {t:"Ireland; Burstow", k:"case", d:"‘Cause’ and ‘inflict’ are interchangeable, which lets psychiatric illness count."},
        {t:"Dica (2004)", k:"case", d:"D knew he was HIV-positive and had unprotected sex with two women who did not know. Reckless transmission can be s 20. Consent to sex is not consent to the risk of disease."},
        {t:"Konzani (2005)", k:"case", d:"Consent to the risk of infection must be informed. Your slides add that D’s honest but mistaken belief in consent is no defence."},
        {t:"CPS Charging Standards", k:"stat", d:"Examples of GBH: permanent disability, loss of sensory function, visible disfigurement, broken or displaced limbs and bones, a fractured skull, substantial loss of blood, and psychiatric injury."}
      ]},
      {t:"Mens rea cases", c:[
        {t:"Mowatt (1967)", k:"case", d:"D must foresee some harm, not serious harm."}
      ]}
    ]},
    {t:"s 18 OAPA 1861", d:"Wounding or causing GBH with intent. Indictable only, maximum life. Actus reus similar to s 20 but the wording is ‘causing’.", c:[
      {t:"Mens rea", d:"Intention to cause GBH, or to resist or prevent lawful arrest. Recklessness is not enough.", c:[
        {t:"Belfon (1976)", k:"case", d:"Recklessness is not enough for s 18. Intention to cause GBH is required."},
        {t:"Nedrick; Woollin", k:"case", d:"Intention follows murder: direct (aim) or oblique (GBH virtually certain and D appreciated that)."}
      ]}
    ]},
    {t:"Consent", d:"Consent is a defence to assault and battery because it removes the ‘unlawful’ element. It is not a defence to ABH or worse unless the activity falls in a public-interest exception.", c:[
      {t:"General rule", c:[
        {t:"Donovan (1934)", k:"case", d:"D caned a 17-year-old girl for sexual pleasure with her consent. If bodily harm is a probable consequence, consent is immaterial."},
        {t:"AG’s Reference (No 6 of 1980)", k:"case", d:"Lord Lane CJ: it is not in the public interest that people should cause each other actual bodily harm for no good reason. Irrelevant whether in public or private."}
      ]},
      {t:"Exceptions", d:"Lord Lane’s list: surgery, properly conducted sports, lawful chastisement or correction, dangerous exhibitions. Tattooing, piercing and branding are also treated as lawful (Wilson 1997).", c:[
        {t:"Sport: Barnes (2004)", k:"case", d:"D broke an opponent’s leg in an amateur football match (s 20). Prosecution should be reserved for particularly grave conduct. Objective test: could the conduct reasonably be regarded as consented to? Factors: type and level of sport, nature of the conduct, whether in play, force used, risk, and D’s state of mind."}
      ]},
      {t:"Sexual gratification", c:[
        {t:"Brown [1994] HL", k:"case", d:"Group of sadomasochistic men consensually inflicted injuries amounting to ABH and GBH, in private. Consent no defence. Lord Templeman: society must protect itself against a ‘cult of violence’. The ECtHR found no breach of Art 8."},
        {t:"Slingsby (1995)", k:"case", d:"D inserted his hand into V consensually. His signet ring cut her, she contracted septicaemia and died. Unlawful act manslaughter charged. Brown distinguished because the injuries were accidental."},
        {t:"Wilson (1997)", k:"case", d:"D carved his initials into his wife’s buttocks with a hot knife at her request. Consent was a defence: akin to tattooing and not in the public interest to prosecute."},
        {t:"Emmett (1999)", k:"case", d:"D asphyxiated and burned his partner during sex. Consent was no defence. Brown applied and Wilson distinguished on the extent of harm."}
      ]},
      {t:"Body modification", c:[
        {t:"R v BM [2018] EWCA Crim 560", k:"case", d:"A tattooist and piercer with no medical qualifications removed a customer’s ear and nipple and split another’s tongue, without anaesthetic, with full consent. Consent was no defence. Brown applied. No analogy with tattooing or piercing, which Parliament has regulated. Any new exception is for Parliament."}
      ]},
      {t:"Valid consent", d:"Consent must be freely given by a fully informed, competent adult. Fraud vitiates consent only as to the identity of D or the nature and quality of the act.", c:[
        {t:"Burrell v Harmer (1967)", k:"case", d:"A minor’s consent is invalid."},
        {t:"Richardson (1998)", k:"case", d:"A suspended dentist continued treating patients. Lying about qualifications is not fraud as to identity, so consent still negated liability."},
        {t:"Tabassum (2000)", k:"case", d:"D claimed to be doing a breast cancer study and examined three women’s breasts. They consented to a medical examination, not a sexual touching. Fraud as to nature and quality."},
        {t:"Dica; Konzani", k:"case", d:"Consent to sex is not consent to HIV risk if the risk is concealed. Consent must be informed."}
      ]}
    ]},
    {t:"Evaluation: body modification", d:"Should ABH and GBH apply to body modification? You can argue either way if you apply Brown, Wilson and BM and discuss autonomy against paternalism.", c:[
      {t:"For applying the law", d:"Public interest and paternalism (AG’s Ref; Brown). The risks: infection, permanent harm, irreversibility. Consent may not be truly free or informed. Consistency with Brown, and BM said any new exception is for Parliament. Tattoos and piercings are accepted because Parliament regulated them."},
      {t:"Against", d:"Autonomy (Lord Mustill’s dissent in Brown). Inconsistency: boxing, rugby, cosmetic surgery and piercing involve serious harm with consent, and Brown, Wilson and BM are hard to reconcile. Proportionality: s 18 carries life for a consenting practitioner. Human rights: Arts 8 and 9, though Laskey v UK accepted the Brown convictions. Law Commission (1995) proposed consent for non-serious harm with specific exceptions for serious harm."},
      {t:"A balanced view", d:"Regulate and license body modification with qualifications, hygiene standards, informed consent and age limits. Keep criminal liability for unlicensed practitioners and extreme procedures. Let Parliament set the line."}
    ]}
  ]}
};

{t:"nf", q:"A burst blood vessel in V’s eye with no break in the skin (C v Eisenhower) is:", o:["A wound","Not a wound","GBH only","ABH only"], a:1, e:"Internal bleeding and bruising are not wounds because the skin was not broken."},

{t:"nf", q:"According to Wilson [1984] and Ireland; Burstow, ‘inflict’ in s 20:", o:["Requires an assault","Does not require an assault, and is interchangeable with ‘cause’","Means ‘wound’","Requires a weapon"], a:1, e:"That also lets psychiatric illness count."},
{t:"nf", q:"The mens rea for s 20 is:", o:["Intention to cause GBH only","Intention or recklessness: D must foresee some harm might result, not necessarily serious harm","Negligence","Strict liability"], a:1, e:"Mowatt; Savage; Parmenter."},
{t:"nf", q:"Dica is authority that:", o:["Consent to sex is consent to HIV risk","Knowingly infecting a partner with HIV can be s 20, because consent to sex is not consent to the risk of disease","HIV transmission is never criminal","Consent is irrelevant to sex"], a:1, e:"Konzani adds that consent to the risk must be informed."},
{t:"nf", q:"The mens rea for s 18 is:", o:["Recklessness","Intention to cause GBH, or to resist or prevent lawful arrest","Negligence","Foresight of some harm"], a:1, e:"Belfon: recklessness is not enough. Intention follows murder (Nedrick; Woollin)."},
{t:"nf", q:"Consent is a defence to:", o:["Assault and battery, but not ABH or worse, unless a public-interest exception applies","All non-fatal offences","Only s 18","Only offences in private"], a:0, e:"Donovan; AG’s Reference (No 6 of 1980)."},
{t:"nf", q:"In AG’s Reference (No 6 of 1980), which of these is NOT in Lord Lane’s list of exceptions?", o:["Surgery","Properly conducted sports","Dangerous exhibitions","Sadomasochism"], a:3, e:"Brown held sadomasochistic harm falls outside the exceptions."},
{t:"nf", q:"The test for consent in sport in Barnes is:", o:["Subjective: what D thought","Objective: could the conduct reasonably be regarded as consented to, with factors such as type of sport, level and whether it was in play","That any foul is a crime","That consent is always a defence"], a:1, e:"Prosecution should be reserved for particularly grave conduct."},
{t:"nf", q:"In Brown, the House of Lords held that consensual sadomasochistic harm was:", o:["Lawful","A crime, as consent was no defence to ABH or GBH","A crime only in public","Not an offence if no injury"], a:1, e:"The ECtHR later found no breach of Art 8."},
{t:"nf", q:"Wilson (1997), where a husband branded his initials on his wife at her request, differs from Brown because:", o:["It was a crime","Consent was a defence: it was akin to tattooing and not in the public interest to prosecute","There was no injury","It was in public"], a:1, e:"Emmett (asphyxiation and burning) was distinguished on the extent of harm."},
{t:"nf", q:"In R v BM [2018], consent was no defence to a body modifier removing an ear and nipple because:", o:["The customer was a minor","Brown applied, there was no analogy with regulated tattooing, and any new exception is for Parliament","The customer was not competent","He was a doctor"], a:1, e:"Consent was full, but still no defence."},

{t:"nf", q:"Which is the correct maximum sentence for assault and battery under s 39 CJA 1988?", o:["Life","7 years","5 years","6 months (summary only)"], a:3, e:"Your note marks this as extra. Both are summary-only offences."}

PQS.push(
{
  id:"pq12", t:"nf", title:"The messages", tags:["Assault","Psychiatric harm","ABH","s 20","Burstow"],
  facts:"After a bad break-up, Leo sends his ex-partner Mia dozens of threatening texts over three months (‘I know where you live’, ‘You’ll regret this’) and makes late-night silent calls. Mia has sleepless nights, loses weight and is later diagnosed by a psychiatrist with severe depression. Discuss Leo’s liability under the Offences Against the Person Act 1861 and the Criminal Justice Act 1988.",
  task:"Work up the ladder, starting from assault. For each offence, give actus reus, then mens rea, then the evidence you would need.",
  steps:[
    {h:"1. Assault (s 39 CJA 1988)", p:["Definition: an act causing V to apprehend immediate unlawful violence (Fagan). Words and silence can be an assault (Ireland; Burstow, a jury question).","Immediacy: read widely. Constanza: violence at some point not excluding the immediate future. If the calls or texts suggest Leo is nearby or about to arrive, this is met. Pure threats about the future are weaker (Tuberville: context decides).","Mens rea: intention or recklessness as to causing fear (Cunningham)."]},
    {h:"2. ABH (s 47)", p:["Needs an assault or battery, causation (Roberts) and ABH. Psychiatric injury can be ABH if it is a recognised condition (Chan-Fook). Sleepless nights and fear are not enough. A diagnosed severe depression is likely enough, with expert evidence (Morris).","Mens rea is only that of the assault (Savage; Parmenter). Leo need not have foreseen depression."]},
    {h:"3. s 20", p:["Burstow is on point: depression from a harassment campaign can be GBH, and ‘inflict’ does not need direct violence.","Is ‘severe depression’ really serious or serious harm (DPP v Smith 1961; Saunders)? It depends on the psychiatric evidence.","Mens rea: Leo must foresee some harm might result (Mowatt). Repeated threats over three months make foresight easier to infer."]},
    {h:"4. s 18", p:["Only if the prosecution can prove intent to cause GBH. A sustained campaign might support it, but intention is hard to prove (Belfon; Woollin)."]},
    {h:"5. Other offences", p:["The Protection from Harassment Act 1997 (harassment and stalking) and communications offences are often easier to prove than the OAPA offences. Mention them briefly as practical alternatives."]},
    {h:"6. Conclude", p:["Most likely s 47, and arguably s 20 on Burstow, subject to medical evidence of a serious recognised illness and proof of foresight. Basic assault depends on whether the messages created fear of imminent violence."]}
  ]
},
{
  id:"pq13", t:"nf", title:"The glass at the bar", tags:["Battery","s 47","s 20","Savage","Wounding"],
  facts:"In a pub argument Moe throws the contents of his glass at Chris. The glass slips from his hand, hits Dan, who is standing nearby, and cuts through his skin, needing eight stitches. Moe says he only meant to splash Chris. Discuss Moe’s liability for each victim.",
  task:"Take Chris and Dan separately. For Dan, go through s 47 then s 20.",
  steps:[
    {h:"1. Chris: battery", p:["Battery: infliction of unlawful force. Force can be indirect, such as by throwing a liquid (DPP v K; Martin). Slight force is enough (Faulkner v Talbot).","Mens rea: intention to apply force, so met. No consent. Self-defence is unlikely in a verbal argument."]},
    {h:"2. Dan: s 47", p:["Assault or battery: the throw. Causation: Moe’s act caused the cut. Transferred malice means his intention to hit Chris is applied to Dan.","ABH: a cut needing stitches is ABH (CPS charging standard).","Mens rea: only that of the battery (Savage; Parmenter, Lord Ackner). Moe need not foresee the cut. So s 47 is likely."]},
    {h:"3. Dan: s 20 wounding", p:["Actus reus: a cut that breaks both layers of skin is a wound (Moriarty; M’Loughlin). Compare internal bleeding and bruises (Eisenhower).","Mens rea: s 20 needs foresight of some harm (Mowatt). Moe meant to throw a drink and the glass slipped. In Savage itself, the s 20 conviction was replaced by s 47. Foresight is hard to prove. Discuss whether throwing a glass-held drink at someone shows foresight of some harm."]},
    {h:"4. Conclude", p:["Battery for Chris. s 47 for Dan. s 20 is possible if the jury finds foresight of some harm, but unlikely on these facts."]}
  ]
},
{
  id:"pq14", t:"nf", title:"Football, a tattoo and a brand", tags:["Consent","Sport","Barnes","Wilson (1997)","Brown"],
  facts:"(1) During an amateur five-a-side match, Rob, angry after missing the ball, deliberately kicks Sid in the head. Sid is knocked unconscious and has a fractured cheekbone. (2) At Ana’s request, her boyfriend Ben brands her initials on her shoulder with a hot iron. (3) Cal, an unlicensed body modifier with no medical training, removes a customer’s earlobe at the customer’s request. Discuss the liability of Rob, Ben and Cal.",
  task:"Treat each incident separately. For each: offence, then whether consent is a defence, then conclusion.",
  steps:[
    {h:"1. Rob: the offence", p:["A deliberate kick to the head causing unconsciousness is at least ABH (s 47). A fractured cheekbone is likely GBH (CPS examples: broken or displaced bones), so s 20, and s 18 only if he intended GBH."]},
    {h:"2. Rob: consent in sport", p:["Consent to the ordinary risks of a sport does not extend to intentional ABH or GBH where the sport does not necessarily involve harm. AG’s Ref (No 6 of 1980): properly conducted sports are an exception.","Barnes: objective test, could the conduct reasonably be regarded as consented to? Apply the factors: type and level of sport (amateur five-a-side), nature of the conduct (a deliberate kick), whether in play (angry reaction, not in play), force and risk (high), state of mind (anger).","Conclude consent probably fails and the conduct is ‘particularly grave’."]},
    {h:"3. Ben: branding", p:["Injury amounts to ABH at least. Consent is no defence to ABH or worse (Donovan) unless in a public-interest exception.","Wilson (1997): branding initials at the wife’s request was akin to tattooing, and consent was a defence. Brown is distinguished: no sadomasochistic cult. Emmett is distinguished on extent of harm.","Likely not liable, if the facts match Wilson."]},
    {h:"4. Cal: body modification", p:["Removing an earlobe is ABH or GBH. R v BM: consent was no defence for body modifiers with no medical qualification. Brown applied. No proper analogy with tattooing, which Parliament has regulated.","Cal is unlicensed and has no medical training, so liability is likely. Mention that any new exception is for Parliament."]},
    {h:"5. Conclude", p:["Rob: s 47 or s 20, no consent defence. Ben: probably protected by Wilson. Cal: liable (BM). Point out the line between Wilson and BM is hard to justify and you can discuss reform."]}
  ]
},
{
  id:"pq15", t:"nf", title:"The prank", tags:["Indirect force","Battery","s 47","s 20","Martin","DPP v K"],
  facts:"As a joke, Jay locks the only door of a crowded student common room and shouts ‘fire!’. Students panic and rush the door. Priya is knocked down and breaks her wrist. Jay also pours a harmless-looking but irritating chemical into the hand dryer in the toilets, and a student, Tom, uses it and is burned on the hands, needing hospital treatment. Discuss Jay’s liability.",
  task:"Two incidents. Use indirect force cases and be precise about the mens rea for each offence.",
  steps:[
    {h:"1. The panic", p:["Battery: force may be applied indirectly (Martin, where lights were put out and an exit blocked). Here the prank caused panic and Priya was injured.","ABH (s 47): broken wrist is ABH. Causation: factual and legal (Roberts). The panic is a foreseeable result of shouting ‘fire’ in a locked room. Mens rea for s 47 is only that of the assault or battery (Savage; Parmenter).","s 20: a broken wrist might be GBH (broken bones). Jay must foresee some harm might result (Mowatt). Argue whether locking a room and shouting ‘fire’ shows that foresight. Martin was convicted under s 20 on similar facts."]},
    {h:"2. The hand dryer", p:["Battery via a medium D controls (DPP v K): the dryer was the means. Burn needing hospital treatment is ABH at least, possibly GBH if serious.","DPP v K: guilty of s 47. Mens rea for s 47: Jay intended the application of force or was reckless as to it (Venna). He put the chemical in knowing someone might use it.","s 20: foresight of some harm. Putting an irritant in a dryer strongly suggests foresight of some harm."]},
    {h:"3. Conclude", p:["Panic: s 47, possibly s 20 (Martin). Hand dryer: s 47, likely s 20. s 18 would need proof of intent to cause GBH."]}
  ]
},
{
  id:"pq16", t:"nf", title:"Essay plan: consent and body modification", tags:["Essay","Brown","Wilson (1997)","BM","Autonomy"],
  facts:"“The criminal law should not apply to consensual body modification.” Discuss.",
  task:"A planning exercise. Build an argument that uses the cases, and reach a view.",
  steps:[
    {h:"1. Set up the law", p:["Consent is a defence to assault and battery but not to ABH or worse (Donovan; AG’s Ref (No 6 of 1980)), unless a public-interest exception applies: surgery, sport, tattooing and piercing, branding (Wilson 1997).","Brown: consensual sadomasochistic harm criminal. BM: consent no defence to body modification (ear, nipple, tongue)."]},
    {h:"2. The case for applying the law", p:["Public interest and paternalism: Lord Templeman’s ‘cult of violence’, AG’s Ref.","Risk: infection, permanent harm and irreversibility, especially without medical training or anaesthetic (BM).","Vulnerability: is consent truly free and informed? Dica and Konzani stress informed consent.","Consistency and certainty: BM treated Brown as binding and said new exceptions are for Parliament. Tattooing and piercing are regulated."]},
    {h:"3. The case against", p:["Autonomy: Lord Mustill’s dissent in Brown. The state should not criminalise private consensual conduct without harm to others.","Inconsistency: Wilson allowed branding like tattooing, but BM and Brown did not. Boxing, rugby and cosmetic surgery involve serious harm with consent.","Proportionality: s 18 carries life, and it is the same offence for a consenting practitioner and a violent attacker.","Human rights: Arts 8 and 9, although Laskey v UK accepted the Brown convictions. Law Commission 1995 proposed reform."]},
    {h:"4. Reach a view", p:["Model view: regulate and license body modification (qualifications, hygiene, informed consent, age limits), keep criminal liability for unlicensed and extreme procedures, and leave the line to Parliament.","Either conclusion is fine if you apply Brown, Wilson and BM and weigh autonomy against paternalism."]}
  ]
}
);

PLAIN.push(
{t:"nf", h:"The ladder of offences", s:"Assault, battery, ABH, s 20, s 18.", say:"At the bottom, assault is making someone fear violence and battery is touching them. Then ABH (an injury), then s 20 (serious injury or a cut through the skin), then s 18 (the same, but meant). More serious injury and stricter intent mean a heavier sentence.", ex:"A threat is an assault. A slap is a battery. A black eye is ABH. A broken leg is s 20 or s 18 depending on what D meant.", m:"A-B-A-W-I: Assault, Battery, ABH, Wound/GBH, Intent"},
{t:"nf", h:"Assault is about fear, not contact", s:"V must fear immediate unlawful violence.", say:"What counts is what V believes. A fake gun works if V thinks it is real. Words and even silence can be an assault, but words can also cancel one. ‘Immediate’ means very soon, not this very second.", ex:"A silent caller who might be on the doorstep. A man staring through a bedroom window.", m:"Fear, not touch"},
{t:"nf", h:"Battery: any unwanted touch", s:"Unlawful force, however slight, directly or indirectly.", say:"No injury is needed. Throwing something, setting a trap or using a medium such as a hand dryer all count. Everyday bumps in a crowd do not, because we all accept them.", ex:"Hiding acid in a hand dryer (DPP v K). Cutting the lights and blocking the exit (Martin).", m:"Touch, directly or indirectly"},
{t:"nf", h:"ABH in one line", s:"An assault or battery that causes real hurt.", say:"Hurt includes bruises, cuts needing treatment, lost hair and a diagnosed psychiatric illness. Fear and distress alone do not count. D only needs the mens rea of the assault or battery, not of the injury.", ex:"Savage meant to splash beer, the glass slipped, and she was still liable for the cut.", m:"Meant the touch, not the harm"},
{t:"nf", h:"Wounding v GBH", s:"A wound breaks both layers of skin. GBH is serious harm.", say:"A scratch is not a wound. A bruise or internal bleed is not a wound. GBH is about how serious the harm is, and can include psychiatric illness. s 20 needs foresight of some harm. s 18 needs intent to cause GBH.", ex:"A deep cut is a wound. A broken bone is GBH even with no cut.", m:"Skin broken v seriously harmed"},
{t:"nf", h:"Mens rea up the ladder", s:"Intent or recklessness at the bottom, intent only at the top.", say:"Assault, battery and ABH: intention or recklessness as to the assault or battery. s 20: foresight of some harm. s 18: intention to cause GBH, and recklessness is not enough.", ex:"Reckless throwing of a glass could be s 20. Throwing it to cause serious harm is s 18.", m:"Reckless … reckless … reckless … intent"},
{t:"nf", h:"Consent in one line", s:"A defence to assault and battery, not to ABH or worse, unless the law makes an exception.", say:"The law protects people from harm for no good reason. Exceptions are surgery, properly conducted sports, tattooing, piercing and branding, and a few others. Sadomasochism (Brown) and body modification (BM) are not exceptions.", ex:"Wilson (1997): branding initials at her request, lawful. Brown: S&M, unlawful.", m:"Touch yes, injury no, unless exception"},
{t:"nf", h:"When is consent real?", s:"Free, informed and given by a competent adult.", say:"A minor’s consent is invalid. Lying about your qualifications does not cancel consent (Richardson). Lying about what you are doing does (Tabassum). Hiding HIV risk means consent to sex was not consent to the risk (Dica; Konzani).", ex:"A fake cancer study used to examine women’s breasts: no valid consent.", m:"Who and what, not why"},
{t:"nf", h:"Consent and sport", s:"You accept the ordinary risks of the game, not deliberate serious harm.", say:"Barnes: the test is whether the conduct could reasonably be regarded as consented to. Look at the sport, the level, whether it was play, the force and D’s state of mind. Prosecution is for particularly grave conduct.", ex:"A hard but fair tackle is accepted. A deliberate kick to the head in anger is not.", m:"Play, not payback"}
);

// Topic: Sexual offences (t:"so"), SOA 2003.
MAPS.so = {
  title: "Sexual offences",
  root: {t:"Sexual offences (SOA 2003)", d:"One gender-neutral statutory code that replaced the SOA 1956. Core structure: a sexual act, no consent, and no reasonable belief in consent. Consent is defined in s 74, with presumptions in ss 75 and 76.", c:[
    {t:"Background and reform", d:"The old law was spread across many statutes, mainly the SOA 1956, with provisions going back to the 18th century. The 2002 White Paper called it archaic, incoherent and discriminatory. The SOA 2003 came into force on 1 May 2004.", c:[
      {t:"What the 2003 Act did", d:"Repealed most of the old law, put case law on a statutory footing, redefined rape, created assault by penetration, sexual assault and causing sexual activity, defined consent for the first time (s 74) and created offences for children under 13 (ss 5–8)."},
      {t:"Before 2003", d:"Rape was “unlawful sexual intercourse” with a woman. Only men could rape. No oral rape (it was indecent assault). No statutory definition of consent."}
    ]},
    {t:"Rape: s 1", d:"Indictable only, maximum life. A intentionally penetrates the vagina, anus or mouth of B with his penis, B does not consent, and A does not reasonably believe B consents.", c:[
      {t:"Actus reus", d:"Two elements: penile penetration of vagina, anus or mouth, and B does not consent.", c:[
        {t:"Penetration: continuing act (s 79(2))", d:"A continuing act from entry to withdrawal. If consent is withdrawn and D carries on, that is rape. Penetration need only be slight.", c:[
          {t:"Kaitamaki (1985)", k:"case", d:"Penetration is a continuing act."},
          {t:"Cooper; Schaub (1994)", k:"case", d:"Same principle. Now statutory in s 79(2). Your slides call it “Cooper v Schaub”, but it is one joint case."}
        ]},
        {t:"Only a penis", d:"Penetration by any other part of the body or an object is not rape, but may be assault by penetration (s 2)."},
        {t:"Gender and trans people", d:"Wording is gender neutral for victims. Section 79(3) includes surgically constructed body parts, so a trans woman can be a victim of vaginal rape and a trans man who has undergone reassignment can be guilty of rape."}
      ]},
      {t:"Who can commit rape?", c:[
        {t:"Principal", d:"Only a person with a penis."},
        {t:"Accessory", d:"A woman can be convicted as an accessory if she aids, abets, counsels or procures.", c:[
          {t:"DPP v K & B (1997)", k:"case", d:"Two girls were involved in an ordeal in which another girl was forced to have sex with a boy. A woman can be an accessory to rape. Now they could also be charged under s 4."}
        ]},
        {t:"Marital rape", d:"R v R (1991): a husband can rape his wife. Rape had required “unlawful” intercourse, read as outside marriage. Section 142 CJPOA 1994 removed “unlawful”. The 2003 Act keeps that position.", c:[
          {t:"R v R (1991)", k:"case", d:"Marriage is no defence."}
        ]}
      ]},
      {t:"Mens rea: two elements", k:"key", d:"(1) Intentional penetration (subjective, rarely contested). (2) No reasonable belief in consent (s 1(1)(c)). Under s 1(2), reasonableness is judged on all the circumstances, including any steps D took to ascertain consent.", c:[
        {t:"How D fails", d:"D satisfies the mens rea if he recognised the risk B might not consent and went ahead, did not care, or held an unreasonable belief in consent."},
        {t:"DPP v Morgan [1976]", k:"case", d:"Old law. Three junior RAF men had sex with a senior officer’s wife, told that her protests were an act. HL: an honest belief in consent, however unreasonable, defeated mens rea. Reasonableness only went to credibility. Criticised, and replaced in 2003 by the reasonableness test (s 1(2))."},
        {t:"R v G (2004)", k:"case", d:"Your notes cite it for the mixed subjective and objective test. Check this citation: I believe R v G [2008] UKHL 37 is a different case, on child rape."}
      ]}
    ]},
    {t:"Consent: ss 74–77", d:"Consent is part of both the actus reus (B does not consent) and the mens rea (no reasonable belief). The burden stays on the prosecution. D bears only an evidential burden.", c:[
      {t:"s 74: the definition", k:"stat", d:"A person consents if he agrees by choice, and has the freedom and capacity to make that choice.", c:[
        {t:"Agrees by choice", d:"Requires positive agreement. The prosecution need not prove C resisted or that D used force.", c:[
          {t:"Larter and Castleton (1995)", k:"case", d:"Rape of a sleeping girl. No force or resistance is needed, and a sleeping person cannot consent."},
          {t:"Malone (1998)", k:"case", d:"C, aged 16, so drunk she could not walk. She need not express lack of consent or resist. Consent is a matter of common sense."},
          {t:"Linekar (1995)", k:"case", d:"D agreed to pay a sex worker £25 and never intended to. Not rape: she agreed to the act and was deceived only about payment. Fraud as to a collateral matter does not remove consent."},
          {t:"R v B (2006)", k:"case", d:"D did not disclose that he was HIV-positive. Not rape, as there was no deception as to the nature of the act. He may be convicted of GBH under s 20 OAPA (compare Dica)."}
        ]},
        {t:"Freedom to choose", d:"Clearly absent where C submits under threats of violence. Unclear whether lesser, non-violent threats negate consent.", c:[
          {t:"Gardiner (1996)", k:"case", d:"Unclear whether non-violent threats negate consent."},
          {t:"Jheeta [2007]", k:"case", d:"D sent C threatening messages and pretended to be a police officer to pressure her into sex to avoid fines. s 76 did not apply, but she lacked freedom to choose under s 74."}
        ]},
        {t:"Capacity to choose", d:"The Act does not define capacity. Guidance may come from s 30(2): ability to understand the nature and consequences of the act.", c:[
          {t:"R v Bree [2007] (essential)", k:"case", d:"Both drunk, C very drunk and sick, they had sex. A drunk person can consent. If drink has caused C to lose the capacity to choose, there is no consent. Capacity can be lost well before unconsciousness. Case by case."},
          {t:"Memory loss", d:"If C cannot remember, s 75 helps only if she was unconscious or the drink was spiked. Otherwise the prosecution must prove lack of capacity under s 74. If the jury is unsure, acquit."}
        ]}
      ]},
      {t:"s 75: evidential presumptions", k:"stat", d:"If D did the relevant act (s 77), one of the circumstances existed and D knew of it, the jury presumes (i) no consent and (ii) no reasonable belief. D rebuts by raising enough evidence to leave the prosecution unable to prove the issue beyond reasonable doubt.", c:[
        {t:"(a) Violence or fear of immediate violence", d:"At the time or immediately before. Can come from any person, not just D."},
        {t:"(b) Fear of violence to another", d:"C feared violence would be used against another person, such as a child or partner."},
        {t:"(c) Unlawful detention", d:"C was unlawfully detained, and D was not."},
        {t:"(d) Asleep or unconscious", d:"Includes date-rape drugs and intoxication."},
        {t:"(e) Physical disability", d:"C had a physical disability meaning she could not communicate consent."},
        {t:"(f) Stupefying substance", d:"A substance capable of stupefying or overpowering C was administered or taken without her consent. Can be given by anyone. It need only be capable of stupefying."}
      ]},
      {t:"s 76: conclusive presumptions", k:"stat", d:"If D intentionally deceived C in one of two ways, it is conclusively presumed C did not consent and D had no reasonable belief. No evidence can rebut. Only these two situations (Jheeta).", c:[
        {t:"(a) Nature or purpose of the act", d:"Examples in your notes below.", c:[
          {t:"Flattery (1877)", k:"case", d:"D pretended intercourse was surgery."},
          {t:"Williams (1923)", k:"case", d:"A vocal coach said intercourse would improve her singing."},
          {t:"Tabassum (2000)", k:"case", d:"Fake breast cancer researcher. Women consented to touching, not to its sexual quality. In the Act, “quality” has become “purpose”."}
        ]},
        {t:"(b) Impersonation of someone known personally to C", d:"Posing as a famous person (a footballer or pop star) does not trigger s 76(2)(b).", c:[
          {t:"Elbekkay (1995)", k:"case", d:"D got into bed with C, who thought he was her boyfriend."}
        ]}
      ]},
      {t:"s 77: “relevant act”", k:"stat", d:"Defines the relevant act for ss 75 and 76 (penetration, touching or causing sexual activity, depending on the offence)."},
      {t:"Deception after 2003", d:"Where s 76 does not apply, the question is whether C agreed by choice under s 74. Developing law, so cite carefully.", c:[
        {t:"McNally [2013]", k:"case", d:"D, a girl, posed as a boy and had sexual activity (including penetration with a sex toy) with another girl who thought D was male. Gender deception can negate consent under s 74."},

    ]},
    {t:"Assault by penetration: s 2", d:"Indictable only, maximum life. Penetration of vagina or anus with a part of A’s body or anything else, the penetration is sexual (s 78) and B does not consent. A must intend the penetration and not reasonably believe B consents. Sections 75 and 76 apply.", c:[
      {t:"Rape v s 2", d:"Rape: penis only, vagina, anus or mouth, person with a penis as principal. s 2: any body part or object, vagina or anus only, anyone can commit it, must be sexual (s 78)."},
      {t:"Practical use", d:"Where C does not know whether penetration was by penis, finger or object, D can still be convicted of a life-maximum offence."}
    ]},
    {t:"Sexual assault: s 3", d:"Either way, maximum 10 years. Replaced indecent assault. D intentionally touches B, the touching is sexual, B does not consent and A does not reasonably believe B consents. Sections 75 and 76 apply.", c:[
      {t:"Touching", d:"Any part of the body or an object. Includes touching clothing. Slight touching is enough. It is a battery that is sexual.", c:[
        {t:"R v H [2005]", k:"case", d:"D asked C “do you fancy a shag?”, she walked away, and he grabbed her jogging bottoms and pulled her towards him. Convicted of sexual assault. Touching what the victim is wearing counts."}
      ]}
    ]},
    {t:"“Sexual”: s 78", d:"A question for the jury, applying an objective test. Penetration, touching or other activity is sexual if a reasonable person would consider that (a) because of its nature it is sexual, or (b) because of its nature it may be sexual, and because of its circumstances or the purpose of any person it is sexual.", c:[
      {t:"Court (1988, HL)", k:"case", d:"D spanked a 12-year-old girl over her clothes and admitted a “buttock fetish”. Test: conduct that right-thinking people would consider an affront to sexual modesty. D’s secret motive did not decide it."},
      {t:"Foot example", d:"Touching a foot is not sexual under (a), even if D has a foot fetish. It may be sexual under (b) if the circumstances or purpose make it so."}
    ]},
    {t:"Causing sexual activity: s 4", d:"Either way, maximum 10 years. If the activity involves penetration (s 4(4)), indictable only, maximum life. D causes B to engage in sexual activity, B does not consent and D does not reasonably believe B consents. Sections 75 and 76 apply.", c:[
      {t:"Causation", d:"Factual and legal causation must be proved. Mere encouragement is not enough."},
      {t:"Typical use", d:"Compelling someone to commit a sexual act, for example forcing C to have sex with a third person. Men and women can both be principals."},
      {t:"Sergeant (1997)", k:"case", d:"D forced a boy to masturbate into a condom. Convicted of indecent assault then. Now it would be s 3 (if touching) or s 4."}

    {t:"Offences against children", d:"Extra material (marked extra in your notes for Q1(d)).", c:[

      {t:"s 9 (extra)", x:true, d:"D aged 18 or over intentionally touches a child under 16, the touching is sexual and D does not reasonably believe the child is 16 or over (or the child is under 13). Consent is no defence."},

    ]},
    {t:"Evaluation: has the 2003 Act improved the law?", d:"Essay approach: argue it substantially improved the law but problems remain.", c:[
      {t:"Strengths", d:"Reasonable belief replaces Morgan and focuses on steps D took. Statutory definition of consent covering intoxication and coercion. Presumptions for sleeping and spiked victims. Oral rape recognised. Gender-neutral victims. Continuing act in statute. Assault by penetration closes the gap left by indecent assault. Section 4 closes the Sergeant gap and covers female offenders."},
      {t:"Criticisms", d:"Penis-only rape (s 2 carries the same maximum but a different label). Freedom to choose is unclear for non-violent threats. Deception cases look inconsistent (McNally against Linekar). Section 76 is narrow. Bree capacity is case by case and unpredictable. Presumptions are easily rebutted. “Sexual” is open-textured. Offence overlap between ss 2, 3 and 4. Low reporting and conviction rates suggest law reform alone is not enough."},
      {t:"Add", d:"Your notes ask for 3–5 academic references (for example Temkin and Ashworth, Ormerod, Herring, Finch and Munro, Elvin and Gibson) and any conviction-rate data. I have not added any."}

{t:"so", g:"Consent", n:"Larter and Castleton", c:"[1995] 1 Cr App R 125 (CA, as I recall it; check)", f:"Rape of a sleeping girl.", r:"The prosecution need not prove resistance or force. A sleeping person cannot consent.", h:"Asleep = no consent."},
{t:"so", g:"Consent", n:"Malone", c:"[1998] 2 Cr App R 447 (CA)", f:"C, aged 16, was so drunk she could not walk and drifted in and out of consciousness.", r:"C need not express lack of consent or resist. Consent is a matter of common sense.", h:"Too drunk to walk."},

PQS.push(
{
  id:"pq17", t:"so", title:"Stan, Francine and Bonnie", tags:["Rape","s 75","s 76","Bree","Linekar","Sexual assault"],
  facts:"Stan and Francine drink vodka and take an ecstasy tablet. Stan suggests intercourse and Francine pushes him away, saying she feels unwell. She lies down. Stan undresses her and strokes her upper body. She feels too ill to resist. She then falls unconscious, and Stan has intercourse with her. A week later, Stan tells Bonnie he is Gary Barlow’s cousin and that if she performs oral sex on him he will arrange a meeting. None of it is true. Bonnie naively agrees. Discuss Stan’s liability.",
  task:"Take Francine in two stages (before and after unconsciousness), then Bonnie.",
  steps:[
    {h:"1. Francine, stage 1: stroking and undressing (s 3)", p:["Touching: intentional, sexual by nature (s 78(a)), and touching clothing counts (R v H).","Consent (s 74): she pushed him away and said she felt unwell, so she did not agree by choice. No need to resist (Larter and Castleton). Capacity: drunk, drugged and too ill to resist, so the jury could find she lacked capacity (Bree).","Mens rea: intentional touching. No reasonable belief after the refusal, and he took no steps to check (s 3(2))."]},
    {h:"2. Francine, stage 2: intercourse (s 1)", p:["Actus reus: penile penetration of her vagina. Consent: s 75(2)(d), asleep or unconscious. If Stan knew she was unconscious, presumptions of no consent and no reasonable belief apply, and he would have to raise evidence to rebut them. Hard, given her earlier refusal.","Even without the presumption, an unconscious person cannot agree by choice or have capacity (s 74).","Section 75(2)(f) is unlikely: she took the substances willingly.","Mens rea: intentional penetration, no reasonable belief in consent."]},
    {h:"3. Bonnie: rape (s 1) by oral penetration", p:["Oral sex performed by Bonnie on Stan means penile penetration of her mouth, which falls within s 1.","Section 76(2)(b): impersonation applies only to a person known personally to C. A celebrity’s cousin is not. Posing as a famous person does not trigger it.","Section 76(2)(a): she knew the nature and purpose of the act. The lie concerned a reward, which is collateral (compare Flattery and Williams).","Section 74: like Linekar, she agreed to the act and was deceived about a benefit. Lawrance reinforces that collateral deceptions do not negate consent. Naivety alone does not remove capacity."]},
    {h:"4. Conclude", p:["Francine: very likely rape and sexual assault. Bonnie: probably no sexual offence. A side-point: fraud by false representation (Fraud Act 2006 s 2) is a stretch where no property is involved."]}
  ]
},
{
  id:"pq18", t:"so", title:"The threat", tags:["Consent","Freedom to choose","s 74","Gardiner","Jheeta"],
  facts:"Steve knows that Jan is committing benefit fraud. He tells her he will report her to the authorities unless she has sex with him. Jan agrees and they have intercourse. Is Steve guilty of rape?",
  task:"The issue is whether a non-violent threat negates consent. Work through the sections to show why s 74 is the only route.",
  steps:[
    {h:"1. Actus reus", p:["Intentional penile penetration, presumably present. The question is consent."]},
    {h:"2. Rule out ss 75 and 76", p:["Section 75(2)(a) and (b) cover violence or fear of violence only. A threat to report to the authorities is not violence, so no evidential presumption.","Section 76 covers only deception about nature or purpose or impersonation. No deception here, so no conclusive presumption.","So the question falls to s 74: did Jan agree by choice, with freedom and capacity?"]},
    {h:"3. Argue both ways", p:["Not consent: a coercive threat left her with no real choice. Jheeta shows pressure which removes freedom to choose can negate consent under s 74. Steve is exploiting her wrongdoing for sex.","Consent: Jan made a hard choice, and the threat was to do something lawful (report a crime). The prosecution must prove lack of consent beyond reasonable doubt, and Gardiner leaves non-violent threats unresolved."]},
    {h:"4. Mens rea", p:["Intentional penetration. Reasonable belief in consent (s 1(2)) is very hard for Steve: he made the threat to obtain sex and knows she is only agreeing because of it."]},
    {h:"5. Conclude", p:["Likely rape if the jury finds her agreement was not a free choice, the more persuasive view, but uncertain. Mention blackmail (Theft Act 1968 s 21) as an alternative."]}
  ]
},
{
  id:"pq19", t:"so", title:"Amie and Bill", tags:["Gender","s 4","Bree","ss 9–10","Children"],
  facts:"Amie, aged 25, persuades Bill, aged 15, to have sex after plying him with alcohol. Discuss Amie’s liability.",
  task:"Start by ruling out rape, then work through s 4 and the child offences.",
  steps:[
    {h:"1. Rape: not available", p:["Rape needs penile penetration by D. Amie has no penis, so she cannot be a principal, and she was the one penetrated.","She cannot be an accessory either, because Bill commits no offence."]},
    {h:"2. Section 4 (causing sexual activity)", p:["Amie causes Bill to engage in sexual activity involving penetration of her vagina by his penis, within s 4(4), maximum life.","Consent: alcohol might remove capacity (Bree). Whether he was too drunk to choose, or merely drunk but capable, is for the jury.","Section 75(2)(f) applies only if the alcohol was administered or taken without his consent. That needs evidence he did not know what he was drinking.","Mens rea: she intended the activity and knew he was drunk."]},
    {h:"3. Sections 9 and 10 (extra)", p:["Section 9: Amie is over 18 and sexually touched a child under 16. She knows he is 15, so she cannot claim reasonable belief he was 16+. Consent is no defence.","Section 10: she caused a child under 16 to engage in sexual activity.","These are the most straightforward routes to conviction."]},
    {h:"4. Conclude", p:["Guilty of ss 9 and 10, and potentially s 4(4) if Bill lacked capacity. Not rape."]}
  ]
},
{
  id:"pq20", t:"so", title:"The lies", tags:["Deception","s 76","McNally","Linekar","Conditional consent"],
  facts:"(1) Pat tells Quinn that he is a doctor performing a medical check, then touches Quinn sexually. (2) Rae, a woman, tells Sam she is a man and they have sexual activity involving penetration with a sex toy. Sam would never have agreed had she known. (3) Tom promises Uma £100 for sex and never intends to pay. (4) Vic gets into Wendy’s dark bedroom and has sex with her, and she thinks he is her husband. Discuss the sexual offence liability in each case.",
  task:"Sort each lie into s 76(2)(a), s 76(2)(b) or s 74 only.",
  steps:[
    {h:"1. Pat: nature or purpose (s 76(2)(a))", p:["Deception about the nature or purpose of the act. Compare Flattery and Tabassum. Conclusive presumption of no consent and no reasonable belief, so sexual assault (s 3) is made out."]},
    {h:"2. Rae: s 74 only", p:["Gender deception is not within s 76. Under McNally, it can negate consent under s 74 because Sam’s choice was tied to a person she believed was male.","This is a developing area. Argue it as a jury question and note that the courts have limited collateral deceptions (Lawrance)."]},
    {h:"3. Tom: collateral (Linekar)", p:["She agreed to the act and was deceived only about payment. Not within s 76, and she agreed by choice under s 74. No rape."]},
    {h:"4. Vic: impersonation (s 76(2)(b))", p:["He impersonated a person known personally to Wendy (Elbekkay). Conclusive presumption: rape."]},
    {h:"5. Conclude", p:["Pat: s 3. Rae: possible s 2 or s 3 through s 74 (McNally). Tom: no sexual offence. Vic: rape. Comment on whether the line between Rae and Tom is principled."]}
  ]
},
{
  id:"pq21", t:"so", title:"Essay plan: has the 2003 Act improved the law?", tags:["Essay","Morgan","Consent","Reform"],
  facts:"“The Sexual Offences Act 2003 has improved the law on rape and other sexual offences.” Discuss.",
  task:"A planning exercise. Argue that the Act is a substantial improvement with remaining problems, and bring in your own academic references.",
  steps:[
    {h:"1. The old law", p:["SOA 1956: rape was “unlawful sexual intercourse” with a woman. Gender-specific, no oral rape, “unlawful” read as outside marriage until R v R, and no statutory definition of consent.","DPP v Morgan: an honest belief, however unreasonable, was a defence. Criticised for protecting men with absurd beliefs and focusing on D’s mind rather than C’s choice."]},
    {h:"2. Improvements", p:["Reasonable belief (s 1(2)) and the steps D took. A statutory definition of consent (s 74) with freedom and capacity, covering intoxication (Bree) and coercion.","Presumptions (ss 75–76), oral rape, gender-neutral victims, penetration as a continuing act (s 79(2)), and assault by penetration (s 2) and s 4 filling gaps such as Sergeant."]},
    {h:"3. Criticisms", p:["Penis-only rape. Unclear freedom to choose, especially for non-violent threats (Gardiner; Jheeta). Inconsistent deception cases: McNally against Linekar. Section 76 narrow.","Bree case-by-case capacity. Easily rebutted presumptions, and jury stereotypes about “real rape”. “Sexual” open-textured (Court; H). Offence overlap between ss 2, 3 and 4. Low reporting and conviction rates."]},
    {h:"4. Conclude", p:["The Act substantially improved the law: it abandoned Morgan, defined consent, widened rape and unified the offences. It is imperfect, and practice depends on how courts and juries apply consent.","Add 3–5 academic references and any conviction-rate data. I have not supplied them."]}
  ]
}
);

PLAIN.push(
{t:"so", h:"The big picture", s:"One code, one structure: act, no consent, no reasonable belief.", say:"The 2003 Act replaced a patchwork of old rules with a single gender-neutral code. Most offences need a sexual act, no consent, and D not reasonably believing there was consent.", ex:"Rape, assault by penetration, sexual assault and causing sexual activity all use the same consent structure.", m:"Act, No consent, No reasonable belief"},
{t:"so", h:"Rape in one line", s:"A penis, vagina, anus or mouth, no consent, no reasonable belief.", say:"Only a penis counts, so only someone with a penis can be the main offender. Penetration is any entry, however slight, and it continues until withdrawal. If someone withdraws consent and D carries on, it is rape from that moment.", ex:"A woman cannot rape as principal but can help someone else do it, as an accessory.", m:"Penis, three orifices"},
{t:"so", h:"The mens rea shift: Morgan to 2003", s:"Honest belief used to be enough. Now it must be reasonable.", say:"Under Morgan, a man who honestly (even stupidly) thought she consented could walk free. Now the belief must also be reasonable, and the jury looks at what he did to check.", ex:"“She didn’t say no” without checking is unlikely to be a reasonable belief.", m:"Honest AND reasonable"},
{t:"so", h:"What is consent? (s 74)", s:"Agrees by choice, with freedom and capacity.", say:"Three parts: you actively agree, you are free to say no, and you are capable of deciding. Not fighting back is not agreeing. Being drunk does not automatically remove capacity, but too drunk to choose does (Bree).", ex:"A sleeping person has no capacity. A tipsy person who knows what they are doing can consent.", m:"Choice, Freedom, Capacity"},
{t:"so", h:"s 75: starts from no consent", s:"Six situations that raise a presumption D can challenge.", say:"Violence or fear of it, fear for another person, unlawful detention, asleep or unconscious, a disability preventing communication, and a drugged drink. If the prosecution proves D knew of the situation, the jury presumes no consent. D can rebut by raising some evidence.", ex:"Sex with a person who is asleep: presumption of no consent.", m:"V-F-D-A-D-S"},
{t:"so", h:"s 76: no way back", s:"Two lies that mean no consent, full stop.", say:"Lying about what the act actually is (a “medical examination”) or pretending to be someone she personally knows (her boyfriend). Other lies, such as being a celebrity or promising money, do not trigger s 76.", ex:"Fake surgery: s 76. Fake £25: not s 76 (Linekar).", m:"What it is or who you are"},
{t:"so", h:"When lies still matter: s 74", s:"Some lies undermine real choice even without s 76.", say:"Gender deception (McNally) and ignoring a condition like withdrawal (R (F) v DPP) can mean there was no real choice. Lies on side issues like money or status usually do not. This is developing law, so cite carefully.", ex:"Pretending to be a man to a woman who would only agree to sex with a man.", m:"Lies about the act or the person"},
{t:"so", h:"Rape v assault by penetration v sexual assault", s:"Penis; other object or body part; any sexual touching.", say:"Rape: penis, three orifices, life. Assault by penetration: fingers or objects, vagina or anus only, life. Sexual assault: any sexual touching including clothing, 10 years.", ex:"Grabbing someone’s jogging bottoms was sexual assault (H).", m:"1 penis, 2 other, 3 touch"},
{t:"so", h:"Children", s:"Under 13 can never consent. Under 16 consent is no defence for an adult.", say:"Sections 5–8 treat consent as irrelevant for under-13s. Section 9 and 10 apply where D is 18 or over and the child is under 16 and D does not reasonably believe they are 16 or over.", ex:"A 25-year-old having sex with a 15-year-old who agrees is still guilty.", m:"13 never, 16 not for adults"}
);

// Topic: Dishonesty and theft (t:"th"), Theft Act 1968.
MAPS.th = {
  title: "Dishonesty and theft",
  root: {t:"Theft and related offences (TA 1968)", d:"Theft is dishonestly appropriating property belonging to another with the intention of permanently depriving the other of it (s 1(1)). Three actus reus elements, two mens rea elements, and all five must be proved. Triable either way, maximum 7 years (s 7). No gain needed (s 1(2)).", c:[
    {t:"Background", d:"The Larceny Act 1916 was replaced by the Theft Act 1968 after the CLRC Eighth Report (1966), which aimed to simplify the law. The Act has still needed a lot of judicial interpretation.", c:[
      {t:"Five elements", k:"key", d:"Actus reus: appropriation (s 3), property (s 4), belonging to another (s 5). Mens rea: dishonesty (s 2), intention to permanently deprive (s 6). All five must be proved (Lawrence v MPC)."}
    ]},
    {t:"Appropriation: s 3", d:"Any assumption by a person of the rights of an owner. Includes a later assumption of a right by keeping or dealing with the property as owner, where D came by it innocently or not without stealing it. Assuming a single right is enough.", c:[
      {t:"Morris (1984)", k:"case", d:"D swapped price labels in a supermarket to pay less. Label swapping alone, or with other acts, was an appropriation. Lord Roskill’s obiter “adverse interference” remark caused confusion."},
      {t:"Later appropriation", d:"D comes by the property innocently (found or borrowed) and later keeps or deals with it as owner. An omission can count."},
      {t:"Does appropriation need no consent?", d:"The central controversy: Lawrence (no) against Morris (obiter, yes), settled in Gomez.", c:[
        {t:"Lawrence v MPC (1972)", k:"case", d:"Taxi driver took £6 from an Italian student’s wallet for a fare of about 50p. The student opened the wallet and let him. Appropriation can occur even though the owner consents."},
        {t:"DPP v Gomez (1993)", k:"case", d:"Assistant manager of an electrical shop accepted two stolen cheques (worth £17,000) from a friend as payment for goods. The HL reconciled the cases: Lawrence is correct, and appropriation does not require absence of consent. Appropriation is separate from dishonesty and intention."},
        {t:"Smith’s view", d:"Anyone doing anything whatever to property belonging to another, with or without the authority or consent of the owner, appropriates it. Liability turns on dishonesty and intention."}
      ]},
      {t:"Gifts", d:"Can a valid gift be appropriated? Mazo said no. Hopkins and Kendrick and Hinks said yes.", c:[
        {t:"Mazo (1997)", k:"case", d:"Maid cashed cheques of about £37,000 from her employer Lady S, who had memory lapses and was suggestible. CA quashed: a valid gift cannot be stolen. Disapproved."},
        {t:"Hopkins and Kendrick (1997)", k:"case", d:"CA criticised Mazo. “Appropriation” is neutral and examined separately from dishonesty."},
        {t:"Hinks (2000, HL)", k:"case", d:"D befriended a 53-year-old man of low intelligence and persuaded him to give her about £60,000 and a TV. A valid gift can be appropriated. Lord Steyn: otherwise dishonest people would be beyond the reach of criminal law. 3–2 majority."},
        {t:"Effect of Hinks", d:"Confirms Gomez and ends the Mazo line. Everything depends on dishonesty. Extends theft to exploiting vulnerable people. Criticised for blurring civil and criminal law and arguably removing the meaning of appropriation (Shute (2002) Crim LR 445, which your notes say they couldn’t access)."}
      ]}
    ]},
    {t:"Property: s 4", d:"Money and all other property, real or personal, including things in action and other intangible property.", c:[
      {t:"Limits", d:"Land generally cannot be stolen (s 4(2)) apart from limited exceptions. Wild plants and animals have special rules (s 4(3), (4)). Both marked extra in your notes."},
      {t:"Confidential information", c:[
        {t:"Oxford v Moss (1979)", k:"case", d:"A student took an exam paper, copied it and returned it. Not convicted of stealing the information, because confidential information is not property."}
      ]},
      {t:"Things in action", d:"A legal right enforceable only by legal action, not by taking possession. Examples: debts, bank credit, shares, copyright, patents.", c:[
        {t:"Davenport (1954)", k:"case", d:"The right to a thing in action is property that can be stolen."},
        {t:"Kohn (1979)", k:"case", d:"D drew cheques on his employer’s account. While the account was in credit or within an agreed overdraft, D appropriated a thing in action: the right to enforce the debt against the bank."}
      ]}
    ]},
    {t:"Belonging to another: s 5", d:"Property belongs to any person having possession or control of it, or having any proprietary right or interest (not an equitable interest arising only from an agreement to transfer or grant an interest).", c:[
      {t:"Own property", c:[
        {t:"Turner (No 2) (1971)", k:"case", d:"D took his car from a garage without paying for the repairs. The garage had possession and control, so he stole his own car."},
        {t:"Meredith (1973)", k:"case", d:"No theft where D took his car from a police impound. A Crown Court decision with little weight."}
      ]},
      {t:"s 5(3): property received for a purpose", k:"stat", d:"Where D receives property from or on account of another, and is under an obligation to retain and deal with it or its proceeds in a particular way, it is regarded (as against him) as belonging to the other. The obligation must be legal, not just moral.", c:[
        {t:"Hall (1973)", k:"case", d:"Travel agent did not pass on deposits. No legal obligation to deal with the money in a particular way, so s 5(3) did not apply."},
        {t:"Davidge v Bunnett (1984)", k:"case", d:"A flatmate gave D money to pay a gas bill and D spent it on Christmas presents. Clear legal obligation, so s 5(3) applied."}
      ]},
      {t:"s 5(4) (extra)", x:true, d:"Property got by another’s mistake (such as an overpayment) can still belong to the payer if D is obliged to restore it (AG’s Reference (No 1 of 1983))."}
    ]},
    {t:"Dishonesty: s 2 and the common law test", d:"A mens rea element. First apply s 2(1). Only if no belief applies does the jury move to the Ivey test.", c:[
      {t:"s 2(1): when D is not dishonest", k:"stat", d:"(a) believes he has in law the right to deprive the other of it; (b) believes he would have the owner’s consent if the owner knew; (c) except for trustees or personal representatives, believes the owner cannot be discovered by taking reasonable steps. Section 2(2): willingness to pay does not stop an appropriation being dishonest."},
      {t:"The test over time", c:[
        {t:"Feely (1973)", k:"case", d:"Was it dishonest by the ordinary standards of reasonable and honest people? Objective."},
        {t:"Ghosh (1982)", k:"case", d:"Two limbs: (1) objectively dishonest, and (2) D realised that reasonable and honest people would regard it as dishonest. Lord Lane’s example: a man from a country with free public transport gets off a bus without paying. Overtaken by Ivey."},
        {t:"Ivey v Genting Casinos [2017] (essential)", k:"case", d:"Phil Ivey won £7.7m at poker in a Mayfair casino using edge-sorting. Civil case, but the Supreme Court said Ghosh’s second limb is wrong. Lord Hughes: establish D’s actual state of knowledge or belief as to the facts, then the fact-finder applies the standards of ordinary decent people. No need for D to appreciate that the conduct is dishonest. Criticism of Ghosh: the more warped D’s standards, the less likely a conviction."},
        {t:"R v Barton and Booth [2020] (essential)", k:"case", d:"Barton owned a Southport nursing home and, over about two decades, targeted wealthy, vulnerable, childless elderly residents and obtained over £4m (powers of attorney, property sales, wills). He was convicted of conspiracy to defraud, fraud, theft, false accounting and money laundering. Booth, his general manager, was convicted of conspiracy to defraud. Five-judge CA (Lord Burnett LCJ, 29 April 2020): Ivey is the test in criminal cases and Ghosh no longer applies (paras 1, 105). Ivey’s remarks were obiter, but where the Supreme Court is unanimous and expressly says a binding CA decision should no longer be followed, the CA must follow it (para 104), applying R v James; R v Karimi [2006] (CA followed a unanimous Privy Council over a House of Lords decision). Appeals dismissed. Barton’s sentence cut from 21 to 17 years."}
      ]},
      {t:"The current test in two steps", k:"key", d:"(1) What was D’s actual belief about the facts? Need not be reasonable, but the more unreasonable it is, the harder to accept D held it. (2) Was the conduct dishonest by the standards of ordinary decent people? D need not realise it."},
      {t:"Do you agree with Lord Hughes?", d:"Mostly yes: the old second limb rewarded warped standards, and the objective test is consistent with civil law and gives clearer directions. Counterpoint: a person who did not realise others would see it as dishonest can be convicted, and “ordinary decent people” may be unclear when views differ (the edge-sorting facts)."}
    ]},
    {t:"Intention to permanently deprive: s 6", d:"Not defined. Merely borrowing is not theft, but s 6 extends the idea.", c:[
      {t:"s 6(1)", k:"stat", d:"D intends to treat the thing as his own to dispose of regardless of the other’s rights. Includes borrowing or lending for a period and in circumstances making it equivalent to an outright taking or disposal.", c:[
        {t:"Fernandes (1996)", k:"case", d:"The key question is whether D treated the property as his own to dispose of, regardless of the owner’s rights."},
        {t:"DPP v Lavender (1994)", k:"case", d:"D took doors from one council property to put on another. Treated them as his own to dispose of, with “dispose of” meaning “deal with”."},
        {t:"Cahill (1993)", k:"case", d:"CA used the dictionary meaning: to deal with definitely, get rid of, make over by sale or bargain. Narrower than Lavender. See also Marshall (1998)."},
        {t:"Marshall (1998)", k:"case", x:true, d:"Another s 6(1) case. Not in your slides. From my own knowledge: D obtained used London Underground tickets and resold them. Check against your reading."},
        {t:"Lloyd (1985)", k:"case", d:"D took films from a cinema, copied them and returned the originals. Lord Lane: borrowing is never enough unless the item is returned so changed that all its goodness and virtue has gone. No theft here. Think of consumables such as a season ticket whose period has expired."},
        {t:"Velumyl [1989]", k:"case", d:"D took £1,050 from his employer’s safe intending to replace it. Theft: money is spent, so replacing equivalent notes is not returning the same property."}
      ]},
      {t:"s 6(2): pawning", k:"stat", d:"Parting with another’s property under a condition as to its return that D may not be able to perform, such as pawning it, is treating it as his own to dispose of. Debate: Card says yes if he cannot in fact redeem it. Smith says no where D is honestly convinced he can."}
    ]},
    {t:"Robbery: s 8", d:"Theft, plus force on any person or putting or seeking to put any person in fear of being then and there subjected to force, immediately before or at the time of stealing and in order to steal. Triable only on indictment, maximum life.", c:[
      {t:"Mens rea", d:"Theft’s mens rea, plus intending to use or threaten force in order to steal."},
      {t:"s 8(2): assault with intent to rob", k:"stat", x:true, d:"Your lecture slide also gives the life maximum for a person guilty of robbery or of an assault with intent to rob."},
      {t:"Level of force", d:"A jury question. Only slight force is needed. Parliament chose “force” rather than the 1916 Act’s “violence”.", c:[
        {t:"Dawson and James (1977)", k:"case", d:"A sailor at Liverpool Pier Head was surrounded by two men who nudged him so that he lost balance. A third took his wallet. Convictions stood. Slight force is enough."},
        {t:"Clouden (1987)", k:"case", d:"D wrenched a shopping basket out of a woman’s hand and ran. The old distinction between force on the person and force on property has gone. A jury question."},
        {t:"RP and Others v DPP (2013)", k:"case", d:"Three girls snatched a lit cigarette from a woman’s fingers. Not force on the person, like pickpocketing. Simple theft."}
      ]},
      {t:"Timing", d:"Immediately before or at the time of stealing. Appropriation is continuing.", c:[
        {t:"Hale (1979)", k:"case", d:"D and an accomplice seized a jewellery box, then tied up the occupant before leaving. Appropriation is a continuing act and the jury decides whether it has finished. Robbery."},
        {t:"Lockley (1995) (extra)", k:"case", x:true, d:"A shoplifter used force to get away. Appropriation was still continuing, so robbery."}
      ]}
    ]},
    {t:"Burglary: s 9", d:"Triable either way. Maximum 14 years for a dwelling and 10 otherwise (marked extra in your notes). A building includes inhabited vehicles and vessels (s 9(3)), even when the occupier is absent.", c:[
      {t:"s 9(1)(a)", k:"stat", d:"D enters a building or part of a building as a trespasser with intent to commit theft, inflict GBH, or do unlawful damage. Intent is needed at entry. The offence need not be completed."},
      {t:"s 9(1)(b)", k:"stat", d:"Having entered as a trespasser, D steals or attempts to steal, or inflicts or attempts to inflict GBH. No intent is needed at entry, but the offence must be committed or attempted."},
      {t:"Mens rea and actus reus (lecture slide)", d:"The slides say the mens rea is the intention to enter and the actus reus is entry to the building, or part of it, as a trespasser. Your earlier notes add that D must know or be reckless as to whether he is trespassing, and in s 9(1)(a) have the s 9(2) intent."},
      {t:"s 9(2): which intents?", d:"The slide text of s 9(2) lists stealing, inflicting GBH, raping any woman therein, and unlawful damage. Your earlier notes list theft, GBH and damage only. I believe the reference to rape was removed when the SOA 2003 came in, so check the current wording."},
      {t:"Entry as a trespasser", d:"D is a trespasser if he enters knowing or being reckless as to whether he enters without permission. Trespass ab initio does not apply.", c:[
        {t:"Collins (1972)", k:"case", d:"D climbed a ladder to a woman’s bedroom window, naked. She thought he was her boyfriend and invited him in as he was on the sill. Conviction quashed: the jury should have been asked whether he had entered substantially as a trespasser before the invitation."}
      ]},
      {t:"How much entry?", c:[
        {t:"Collins", k:"case", d:"Entry needed to be “substantial” and “effective”."},
        {t:"Brown (1985)", k:"case", d:"D smashed an Argos shop window, leaned in and took property while his feet stayed on the pavement. Entry must be effective, not substantial. A jury question."},
        {t:"Ryan (1996)", k:"case", d:"D stuck in the window of an elderly person’s home with his head and one arm inside, rescued by the fire brigade. Partial entry is enough, even though nothing was stolen."}
      ]}
    ]},
    {t:"Fraud Act 2006 (brief)", d:"Supplemental slides. Fraud is committed in three ways, maximum 10 years on indictment.", c:[
      {t:"s 2: false representation", d:"Dishonest false representation, intending to make a gain or cause loss. Relevant to the shoe label, which your notes say is for the next session."},
      {t:"s 3: failing to disclose", d:"Failing to disclose information."},
      {t:"s 4: abuse of position", d:"D occupies a position where he is expected to safeguard or not act against another’s financial interests, dishonestly abuses it and intends to make a gain or cause loss or risk of loss. An omission can be an abuse (s 4(2)). Examples: director and company, professional and client, agent and principal, employee and employer."},
      {t:"s 1: sentence", k:"stat", d:"s 1 lists ss 2, 3 and 4. Summary: up to 12 months or a fine. On indictment: up to 10 years or a fine, or both."},
      {t:"Relationship with theft", d:"Per the lecture, the Fraud Act 2006 deals with offences previously dealt with under the Theft Act 1968."},
      {t:"s 4: actus reus and mens rea", d:"Actus reus: abuse of a position of trust. Mens rea: dishonesty and intention to make a gain or cause a loss. Law Commission: the relationship exists between director and company, professional person and client, agent and principal, employee and employer, or between partners."},
      {t:"s 12", d:"Company officers can be liable where the company commits an offence with their consent or connivance. Includes a director, manager, secretary or similar officer, or someone purporting to act as one. Where the company is managed by its members (s 12(3)), members count as directors."}
    ]},
    {t:"Evaluation: how far has theft been stretched?", d:"The essay in your notes. Argue judicial interpretation has stretched theft well beyond the ordinary person’s idea, with dishonesty doing the limiting work.", c:[
      {t:"The stretching", d:"Consent is irrelevant (Lawrence; Gomez). A valid gift can be stolen (Hinks). Intangibles count (Kohn). You can steal your own car (Turner (No 2)). Later appropriation catches innocent acquirers. Some borrowing is theft (Lavender; Velumyl)."},
      {t:"The brakes", d:"Dishonesty and intention. Lloyd narrowed s 6(1). Cahill gave “dispose of” a narrow meaning. Confidential information is not property (Oxford v Moss). Only legal obligations count under s 5(3) (Hall)."},
      {t:"Dishonesty itself broadened", d:"After Ivey and Barton and Booth, a person who did not realise ordinary people would see it as dishonest can be convicted. Guilt rests on a jury’s moral view, which raises certainty concerns."},
      {t:"Does Ryan clarify the law? (lecture question)", d:"For: confirms partial entry is enough and that nothing need be stolen, building on Brown. Against: it leaves “entry” to the jury case by case, so there is no clear line on how much of the body must be inside. Your call on which side to argue."},
      {t:"For the wide approach", d:"Protects vulnerable people (Hinks). Dishonesty filters out innocent conduct. The Fraud Act 2006 overlaps but has not removed the problem."}
    ]}
  ]}
};
