{t:"th", g:"s 5(4) (extra)", n:"AG’s Reference (No 1 of 1983)", c:"[1985] QB 182 (CA)", f:"A police officer’s salary was overpaid into her bank account.", r:"An obligation to restore the overpayment means it still belongs to the payer (s 5(4)).", h:"Mistaken overpayment.", x:true},
{t:"th", g:"Dishonesty", n:"Feely", c:"[1973] QB 530 (CA)", f:"A bookmaker’s manager borrowed from the till intending to repay.", r:"Was it dishonest by the ordinary standards of reasonable and honest people? Objective.", h:"Ordinary standards."},
{t:"th", g:"Dishonesty", n:"Ghosh", c:"[1982] QB 1053 (CA)", f:"A surgeon claimed fees for operations he did not perform.", r:"Two limbs: (1) dishonest by ordinary standards and (2) D realised that honest people would see it as dishonest. Lord Lane’s free-bus example. Overtaken by Ivey.", h:"Two-step, now gone."},
{t:"th", g:"Dishonesty", n:"Ivey v Genting Casinos", c:"[2017] UKSC 67", f:"Phil Ivey won £7.7m at poker in a Mayfair casino using edge-sorting. The casino refused to pay, treating it as cheating.", r:"A civil case, but the Supreme Court said Ghosh’s second limb is wrong. Establish D’s actual belief about the facts, then apply the standards of ordinary decent people. D need not realise the conduct is dishonest.", h:"Facts as he saw them, standards as we see them."},
{t:"th", g:"Dishonesty", n:"R v Barton and Booth", c:"[2020] EWCA Crim 575", f:"Barton owned a Southport nursing home and over about two decades targeted wealthy, vulnerable, childless elderly residents, obtaining over £4m. Convicted of conspiracy to defraud, fraud, theft, false accounting and money laundering (21 years, cut to 17). Booth, his general manager, was convicted of conspiracy to defraud (6 years). They argued Ghosh should have been used.", r:"Five-judge CA (Lord Burnett LCJ, [2021] QB 685): Ivey is the test in criminal cases and Ghosh no longer applies (paras 1, 105). Ivey’s remarks were obiter, but where the Supreme Court is unanimous and expressly says a binding CA decision should no longer be followed, the CA must follow it (para 104), applying R v James; R v Karimi [2006]. Direction: first the defendant’s actual belief as to the facts (whether it was reasonable is only evidence of whether it was genuinely held), then the standards of ordinary decent people. Appeals dismissed.", h:"Ivey applies in crime."},
{t:"th", g:"s 6", n:"Fernandes", c:"[1996] 1 Cr App R 175 (CA)", f:"A solicitor misused client money.", r:"The key question under s 6(1): did D treat the property as his own to dispose of, regardless of the owner’s rights?", h:"His own to dispose of."},
{t:"th", g:"s 6", n:"DPP v Lavender", c:"[1994] Crim LR 297 (DC)", f:"D took doors from one council property to put on another council property.", r:"He treated them as his own to dispose of, “dispose of” meaning “deal with”. Theft.", h:"Doors from A to B."},
{t:"th", g:"s 6", n:"Cahill", c:"[1993] Crim LR 141 (CA)", f:"A s 6(1) case.", r:"“Dispose of” has its dictionary meaning: deal with definitely, get rid of, make over by sale or bargain. Narrower than Lavender.", h:"Dictionary meaning."},
{t:"th", g:"s 6", n:"Marshall (added)", c:"[1998] 2 Cr App R 282 (CA)", f:"From my own knowledge: D obtained used London Underground tickets and resold them. Not in your slides.", r:"Another s 6(1) case. Check against your reading.", h:"Resold the tickets.", x:true},
{t:"th", g:"s 6", n:"Lloyd", c:"[1985] QB 829 (CA)", f:"D took films from a cinema, copied them and returned the originals.", r:"Mere borrowing is never enough unless the item is returned so changed that all its goodness and virtue has gone. No theft here. Read narrowly.", h:"Goodness and virtue."},
{t:"th", g:"s 6", n:"Velumyl", c:"[1989] Crim LR 299 (CA)", f:"D took £1,050 from his employer’s safe intending to replace it.", r:"Theft. Money is spent, so replacing equivalent notes is not returning the same property. D treated the cash as his own.", h:"Replace the notes, still theft."},
{t:"th", g:"Robbery", n:"Dawson and James", c:"(1977) 64 Cr App R 170 (CA)", f:"A sailor at Liverpool Pier Head was surrounded by two men who nudged him so he lost balance. A third took his wallet.", r:"Whether force was used is a jury question and a slight degree is enough.", h:"A nudge is force."},
{t:"th", g:"Robbery", n:"Hale", c:"(1979) 68 Cr App R 415 (CA)", f:"D and an accomplice seized a jewellery box, then tied up the occupant before leaving.", r:"Appropriation is a continuing act and the jury decides whether it has finished. Force used while it was continuing was at the time of stealing.", h:"Theft isn’t over at the grab."},
{t:"th", g:"Robbery", n:"Clouden", c:"[1987] Crim LR 56 (CA)", f:"D wrenched a shopping basket out of a woman’s hand and ran.", r:"Force on the person. The old distinction between force on the person and force on property has gone. A jury question.", h:"Wrenched the basket."},
{t:"th", g:"Robbery", n:"RP v DPP", c:"[2012] EWHC 1657 (Admin) (your notes say 2013)", f:"Three girls snatched a lit cigarette from a woman’s fingers.", r:"Not force on the person. Like pickpocketing, so simple theft.", h:"Plucked cigarette."},
{t:"th", g:"Robbery (extra)", n:"Lockley", c:"[1995] Crim LR 656 (CA)", f:"A shoplifter used force to escape.", r:"Appropriation was still continuing, so robbery.", h:"Force to get away.", x:true},
{t:"th", g:"Burglary", n:"Collins", c:"[1973] QB 100 (CA)", f:"D climbed a ladder to a woman’s bedroom window, naked. She thought he was her boyfriend and invited him in as he was on the sill.", r:"Conviction quashed: jury must decide whether he entered substantially as a trespasser before the invitation. A trespasser enters knowing or being reckless as to lack of permission. Trespass ab initio does not apply.", h:"Invited on the sill."},
{t:"th", g:"Burglary", n:"Brown", c:"[1985] Crim LR 212 (CA)", f:"D smashed an Argos shop window, leaned in and took property while his feet stayed on the pavement.", r:"Entry must be effective, not substantial. A jury question.", h:"Leaning in."},
{t:"th", g:"Burglary", n:"Ryan", c:"[1996] Crim LR 320 (CA)", f:"D was found stuck in the window of an elderly person’s home with his head and one arm inside. The fire brigade rescued him.", r:"Partial entry is enough, even though nothing was stolen. A jury question.", h:"Stuck in the window."}
);

MCQS.push(
{t:"th", q:"How many elements must be proved for theft under s 1(1)?", o:["Three","Four","Five","Six"], a:2, e:"Appropriation, property, belonging to another, dishonesty and intention to permanently deprive."},
{t:"th", q:"What is the maximum sentence for theft?", o:["2 years","7 years","10 years","Life"], a:1, e:"Triable either way, maximum 7 years (s 7)."},
{t:"th", q:"Which element of theft is NOT part of the actus reus?", o:["Appropriation","Property","Dishonesty","Belonging to another"], a:2, e:"Dishonesty and intention to permanently deprive are the mens rea."},
{t:"th", q:"Section 1(2) says that for theft:", o:["D must make a gain","D need not intend to make a gain","D must cause a loss","D must use force"], a:1, e:"No gain is needed."},
{t:"th", q:"Section 3(1) defines appropriation as:", o:["Taking without consent","Any assumption by a person of the rights of an owner","Moving property","Using property"], a:1, e:"It includes a later assumption by keeping or dealing with it as owner. One right is enough (Morris)."},
{t:"th", q:"In Lawrence v MPC, the taxi driver took £6 from a student who opened his wallet. It was held that:", o:["No appropriation because the student consented","Appropriation can occur even though the owner consents","It was fraud only","It was robbery"], a:1, e:"Absence of consent is not required."},
{t:"th", q:"What did DPP v Gomez decide?", o:["Appropriation needs absence of consent","Appropriation does not require absence of consent, and it is separate from dishonesty","Cheques cannot be stolen","Gifts cannot be stolen"], a:1, e:"It reconciled Lawrence and Morris in favour of Lawrence."},
{t:"th", q:"In Morris, swapping price labels was:", o:["Not an appropriation","An appropriation, as assuming one right of an owner is enough","Robbery","A civil wrong only"], a:1, e:"Lord Roskill’s obiter “adverse interference” remark was later disapproved."},
{t:"th", q:"Which case held that a valid gift can be appropriated?", o:["Mazo","Hinks","Hall","Lloyd"], a:1, e:"House of Lords, 3–2. Mazo took the opposite view and was disapproved."},
{t:"th", q:"A criticism of Hinks is that:", o:["It made theft harder to prove","It convicted D for taking something civil law treated as validly hers, and left dishonesty to do the work","It required consent","It overruled Gomez"], a:1, e:"Shute (2002) argues it blurs the meaning of appropriation."},
{t:"th", q:"Which cannot be stolen under s 4?", o:["Money","A bank balance","Confidential information","Shares"], a:2, e:"Oxford v Moss. Things in action such as bank credit can be stolen."},
{t:"th", q:"A thing in action is:", o:["A physical object","A legal right enforceable only by legal action","Land","A wild animal"], a:1, e:"Examples: debts, bank credit, shares, copyright. Kohn; Davenport."},
{t:"th", q:"In Turner (No 2), D took his car from a garage without paying the repair bill. He:", o:["Could not be guilty, as it was his car","Stole his own car, because the garage had possession and control","Was guilty of burglary","Committed robbery"], a:1, e:"Section 5(1): possession or control by another is enough."},
{t:"th", q:"For s 5(3), the obligation to deal with property in a particular way must be:", o:["Moral","Social","A legal obligation","Written"], a:2, e:"Hall: a moral obligation is not enough. Compare Davidge v Bunnett."},
{t:"th", q:"In Davidge v Bunnett, D spent money given to pay a gas bill. Result:", o:["Not theft","Section 5(3) applied, because there was a legal obligation","Fraud only","Robbery"], a:1, e:"The money still belonged to the giver as against D."},
{t:"th", q:"Hall (1973), where a travel agent failed to pass on deposits, shows that:", o:["Any duty is enough","Section 5(3) needs a legal, not just moral, obligation","The agent was a trustee","Deposits cannot be stolen"], a:1, e:"No legal obligation to deal with the money in a particular way."},
{t:"th", q:"Section 2(1) says D is not dishonest if he believes:", o:["He will pay later","He has in law the right to deprive the other of it","He needs the property","No one will notice"], a:1, e:"Also (b) he would have the owner’s consent and (c) the owner cannot be discovered by reasonable steps."},
{t:"th", q:"Under s 2(2), willingness to pay for the property:", o:["Is a complete defence","Does not stop the appropriation being dishonest","Makes it fraud","Is irrelevant to s 2(1) only"], a:1, e:"It is not conclusive."},
{t:"th", q:"The first limb of Ghosh asked:", o:["Did D realise it was dishonest?","Was the conduct dishonest by the ordinary standards of reasonable and honest people?","Did D gain?","Was the owner harmed?"], a:1, e:"The second limb (D realised others would see it as dishonest) was held wrong in Ivey."},
{t:"th", q:"In Ivey v Genting Casinos, the Supreme Court said:", o:["Ghosh was right","The second limb of Ghosh is wrong, and the standards of ordinary decent people apply after establishing D’s beliefs about the facts","Edge-sorting was honest","The test is purely subjective"], a:1, e:"A civil case, but its comments on criminal dishonesty became the test."},
{t:"th", q:"R v Barton and Booth decided that:", o:["Ghosh still applies in crime","The Ivey test applies in criminal cases","Dishonesty is a question of law","Nursing homes are exempt"], a:1, e:"A five-judge CA, relying on R v James (2006) and following the Supreme Court."},
{t:"th", q:"Under the current test, D’s own view of whether his conduct was dishonest is:", o:["Decisive","Relevant only if reasonable","Irrelevant to the second step","Required to be proved by the prosecution"], a:2, e:"Step 1 is D’s actual belief about the facts. Step 2 applies the standards of ordinary decent people."},
{t:"th", q:"What is the main criticism of Ghosh made in Ivey?", o:["It was too objective","The more warped D’s standards, the less likely a conviction","It convicted too many","It ignored the facts"], a:1, e:"Lord Hughes."},
{t:"th", q:"Section 6(1): treating the thing as his own to dispose of, regardless of the owner’s rights, is treated as:", o:["Dishonesty","Intention to permanently deprive","Appropriation","Robbery"], a:1, e:"It can include borrowing equivalent to an outright taking."},
{t:"th", q:"Lloyd (1985): D copied cinema films and returned the originals. There was no theft because:", o:["The films were not property","D did not intend to permanently deprive, as the films’ goodness or virtue was not gone","D was not dishonest","The films were returned within a day"], a:1, e:"Mere borrowing is not enough."},
{t:"th", q:"Velumyl is authority that:", o:["Taking cash intending to replace it is not theft","Taking cash intending to replace it can be theft, as equivalent notes are not the same property","Money cannot be stolen","Employees cannot steal"], a:1, e:"D treated the cash as his own."},
{t:"th", q:"In DPP v Lavender, D took doors from one council property to fit another. Result:", o:["No theft","Treating them as his own to dispose of, so theft","Burglary","Robbery"], a:1, e:"“Dispose of” meant “deal with”. Cahill gave a narrower dictionary meaning."},
{t:"th", q:"The maximum sentence for robbery under s 8 is:", o:["7 years","10 years","14 years","Life"], a:3, e:"Triable only on indictment."},
{t:"th", q:"Robbery requires force or threat of force:", o:["After the theft","Immediately before or at the time of stealing, and in order to steal","Only on the owner","Only substantial force"], a:1, e:"Section 8(1)."},
{t:"th", q:"Dawson and James (a nudge so a sailor lost balance) is authority that:", o:["Serious force is needed","Only slight force is enough, and it is a jury question","Robbery needs a weapon","Force must be on property"], a:1, e:"A third man took the wallet."},
{t:"th", q:"In RP v DPP, snatching a lit cigarette from a woman’s fingers was:", o:["Robbery","Not force on the person, so simple theft","Assault only","Burglary"], a:1, e:"Compare Clouden, where wrenching a basket from a hand was force."},
{t:"th", q:"Hale (1979) decided that:", o:["Theft ends at the moment of the grab","Appropriation is a continuing act, so force used while it continues can make it robbery","Robbery needs a weapon","The jury has no role"], a:1, e:"D tied up the occupant after seizing the jewellery box."},
{t:"th", q:"Under s 9(1)(a) burglary, intent to commit what is needed at entry?", o:["Only theft","Theft, GBH or unlawful damage","Only GBH","None"], a:1, e:"Section 9(1)(b) needs no intent at entry but the offence must be committed or attempted."},
{t:"th", q:"Which is NOT common to both s 9(1)(a) and s 9(1)(b)?", o:["Entry as a trespasser","A building or part of one","Intent at the time of entry to commit a s 9(2) offence","A trespasser who knows or is reckless as to lack of permission"], a:2, e:"Section 9(1)(b) does not require intent at entry."},
{t:"th", q:"In Brown (1985), leaning through a smashed shop window with feet on the pavement was:", o:["Not entry","Entry, because entry must be effective, not substantial","Entry only if substantial","Not burglary because nothing was stolen"], a:1, e:"A jury question. Collins used “substantial and effective”."},
{t:"th", q:"In Ryan (1996), D stuck in a window with his head and one arm inside:", o:["Had not entered","Had entered: partial entry is enough, even though nothing was stolen","Was guilty only of attempt","Was not a trespasser"], a:1, e:"The fire brigade had to rescue him."},
{t:"th", q:"In Collins (1972), why was the conviction quashed?", o:["The window was open","The jury was not asked whether D had entered substantially as a trespasser before the invitation","It was not a building","D had no intent"], a:1, e:"She mistook him for her boyfriend and invited him in as he was on the sill."},
{t:"th", q:"A building for s 9 includes:", o:["Only houses","Inhabited vehicles and vessels, even when the occupier is absent","Only dwellings","Land"], a:1, e:"Section 9(3)."}
);

PQS.push(
{
  id:"pq22", t:"th", title:"The £10,000 cheque", tags:["s 5(3)","Appropriation","Gifts","Ivey","Hinks"],
  facts:"Debbie’s uncle gives her a £10,000 cheque, saying it is “to help her get a good start in life”, to “sort out her finances” and to put towards a house deposit. Debbie banks it and spends £7,000 paying off her credit cards. Discuss whether she commits theft.",
  task:"Go through all five elements, spending most time on the contested ones.",
  steps:[
    {h:"1. Appropriation and property", p:["Depositing and spending the money assumes the rights of an owner. Gomez and Hinks: even a valid gift can be appropriated, so the uncle’s consent does not prevent appropriation.","Property: the cheque and bank credit are things in action (Kohn; Davenport)."]},
    {h:"2. Belonging to another: the main issue", p:["If the money was an outright gift, there is arguably nothing belonging to another once it is hers, apart from Hinks-style reasoning.","Section 5(3): was she under an obligation to deal with the money in a particular way? The uncle’s words sound like advice or a wish, not a legal obligation. Hall: a moral obligation is not enough. Compare Davidge v Bunnett (money given for a gas bill).","“Sort out her finances” arguably covers paying off credit cards, which weakens any obligation."]},
    {h:"3. Dishonesty (Ivey)", p:["Step 1: what did she actually believe? Probably that the money was hers and that clearing debts sorted out her finances.","Step 2: would ordinary decent people see that as dishonest? Unlikely. Section 2(1)(b) (belief the owner would consent) also helps."]},
    {h:"4. Intention to permanently deprive", p:["Spending the money means she treats it as her own (s 6(1))."]},
    {h:"5. Conclude", p:["Theft is unlikely. The prosecution’s best argument is that s 5(3) applied and she acted dishonestly by not saving a deposit, but a legal obligation and dishonesty are both hard to prove."]}
  ]
},
{
  id:"pq23", t:"th", title:"The shoes", tags:["Morris","Gomez","Robbery","Hale","Dawson and James"],
  facts:"Debbie swaps the £850 price label on a pair of shoes for one marked £10, and the cashier agrees to sell them for £10. The assistant realises and tries to stop her leaving, and Debbie pushes the assistant aside and runs out with the shoes. Discuss her liability for theft and robbery.",
  task:"Theft first, then the timing question in robbery.",
  steps:[
    {h:"1. Theft", p:["Appropriation: swapping the label assumes a right of an owner (Morris). The shop’s later agreement to sell at £10 does not matter, because consent is irrelevant to appropriation (Gomez). Property: the shoes belong to the shop.","Dishonesty: she knew the price and deliberately swapped the label. No s 2(1) belief applies, and paying £10 does not help (s 2(2)). Ivey: ordinary decent people would call it dishonest.","Intention to permanently deprive: she means to keep them. Theft is made out."]},
    {h:"2. Robbery: force", p:["She pushed the assistant, so force was used on a person. Slight force is enough (Dawson and James), and it was direct (Clouden; contrast RP)."]},
    {h:"3. Robbery: timing", p:["Force must be immediately before or at the time of stealing. The theft arguably began at the label swap, or was complete at payment.","Hale: appropriation is a continuing act and the jury decides whether it has ended. Debbie was still in the shop with the goods and was being stopped. Lockley (extra) applied this to a shoplifter using force to get away.","“In order to”: she pushed so she could leave with the shoes, and she intended to use force for that purpose."]},
    {h:"4. Conclude", p:["Theft for certain. Robbery likely on Hale (life maximum). The counter-argument is that the theft was complete earlier, so the force came afterwards: theft plus assault or battery. The jury decides.","Mention that the label swap also raises fraud by false representation (Fraud Act 2006 s 2), which your notes say is for the next session."]}
  ]
},
{
  id:"pq24", t:"th", title:"The car, the phone and the credit", tags:["s 6","Lloyd","Things in action","Dishonesty","s 12"],
  facts:"Debbie takes her flatmate’s car for a weekend without asking, intending to return it, and fills it with petrol. The flatmate had let her use it on short trips before. She also borrows the flatmate’s pay-as-you-go phone, uses £10 of credit, and leaves £10 on the table. Discuss whether she commits theft.",
  task:"Three items: the car, the handset and the credit. The weak point is the intention to permanently deprive.",
  steps:[
    {h:"1. The car", p:["Appropriation: driving it for a weekend assumes the owner’s rights (Gomez). It belongs to the flatmate.","Dishonesty: she may believe the flatmate would have consented (s 2(1)(b)), though a weekend is longer than the short trips allowed before. The jury applies Ivey.","Intention to permanently deprive: she plans to return it. Lloyd: mere borrowing is not enough unless the goodness or virtue is gone, and a weekend’s use does not make it equivalent to an outright taking (s 6(1)). No theft.","Extra: taking a conveyance without consent (s 12 TA 1968), subject to the defence of belief in consent."]},
    {h:"2. The handset", p:["Same analysis as the car. She borrowed it and kept it in the same state, so no theft (Lloyd)."]},
    {h:"3. The £10 credit", p:["Property: pay-as-you-go credit is a contractual right against the network, so a thing in action (s 4(1)), belonging to the flatmate.","Using it consumes it, and it cannot be returned. This resembles Lloyd’s “goodness or virtue gone” and Velumyl, where replacing the value does not alter the intention to treat it as one’s own. Intention to permanently deprive is arguable.","Dishonesty: she left £10, which suggests no dishonesty, and the flatmate had permitted the car. But she did not ask, and s 2(2) says willingness to pay is not conclusive."]},
    {h:"4. Conclude", p:["Car and handset: no theft. Credit: arguable, but dishonesty is doubtful given the repayment."]}
  ]
},
{
  id:"pq25", t:"th", title:"The open window", tags:["Burglary","s 9","Entry","Trespasser","Robbery"],
  facts:"Kit sees an open ground-floor window of a flat and reaches in with one arm to take a laptop from the sill. He is spotted by the occupant, Lena, who grabs the laptop. Kit pulls it from her hands and pushes her into a wall, and escapes with the laptop. Separately, Mo climbs through the window of a neighbouring flat believing it belongs to a friend who said he could stay, takes a bottle of wine and leaves. Discuss the liability of Kit and Mo.",
  task:"Kit: entry, then theft, then robbery. Mo: whether he is a trespasser at all.",
  steps:[
    {h:"1. Kit: burglary", p:["Entry: effective entry is enough (Brown), and partial entry is enough (Ryan). A jury question. A hand and arm through the window is likely to be entry.","Trespasser: he entered knowing he had no permission (Collins).","s 9(1)(a): intent to steal at entry, shown by taking the laptop. s 9(1)(b): he stole after entering as a trespasser."]},
    {h:"2. Kit: theft and robbery", p:["Theft: appropriation, property, belonging to another, Ivey dishonesty and intention to permanently deprive.","Robbery: force on the person (Dawson and James; Clouden), at the time of stealing because appropriation is continuing (Hale), and in order to steal. Likely robbery."]},
    {h:"3. Mo: burglary?", p:["Trespasser: he must know or be reckless as to whether he enters without permission (Collins). He believed he had his friend’s permission, so he is probably not a trespasser if the belief is honest and he did not realise it was the wrong flat. No s 9(1)(a) or (b) burglary.","Theft of the wine: depends on Ivey dishonesty. His actual belief was that he was staying with a friend, so probably not dishonest. Section 2(1)(b) might help if he believed his friend would consent to the wine."]},
    {h:"4. Conclude", p:["Kit: burglary and robbery. Mo: probably neither, subject to the jury’s view of his belief. Note that burglary entry points are fact-sensitive."]}
  ]
},
{
  id:"pq26", t:"th", title:"Essay plan: how far has theft been stretched?", tags:["Essay","Hinks","Gomez","Ivey","Kohn"],
  facts:"“Judicial interpretation has stretched theft well beyond what an ordinary person would regard as theft.” Discuss.",
  task:"A planning exercise. Your notes suggest using Shute (2002) Crim LR 445 and Parsons (2018) 168 NLJ 7807, which I could not access, so check them yourself.",
  steps:[
    {h:"1. Introduction", p:["An ordinary person thinks of theft as secretly taking someone’s belongings without permission. The 1968 Act was meant to simplify, but the courts have moved a long way. The stretching is greatest in the actus reus, with dishonesty now carrying most of the weight."]},
    {h:"2. Appropriation", p:["Lawrence and Gomez: consent is irrelevant. Morris: label swapping is an appropriation. Hinks: a valid gift can be stolen. Section 3(1): later appropriation catches those who acquire innocently.","Critique: an ordinary person would not call receiving a gift theft. The actus reus gives little protection."]},
    {h:"3. Property and belonging to another", p:["Things in action (Kohn; Davenport). Stealing your own car (Turner (No 2)). Section 5(3) (Davidge v Bunnett). Limits: Oxford v Moss and Hall."]},
    {h:"4. Intention to permanently deprive", p:["Section 6(1) catches some borrowing: Lavender, Velumyl. Limits: Lloyd, Cahill. The courts are inconsistent."]},
    {h:"5. Dishonesty", p:["Ivey and Barton and Booth: ordinary-people standard whether or not D realised. A person who did not realise could now be convicted. Certainty concerns."]},
    {h:"6. For the wide approach and conclusion", p:["Protects the vulnerable (Hinks, Lord Steyn). Dishonesty and intention filter innocent conduct. The Fraud Act 2006 overlaps.","Conclude: theft has been stretched very far, dishonesty does the limiting work, and guilt depends heavily on a jury’s moral view."]}
  ]
}
);

PLAIN.push(
{t:"th", h:"Theft in one line", s:"Five boxes to tick, and one missing box means no theft.", say:"You did something an owner could do (appropriation), with something that counts as property, that belonged to someone else, dishonestly, meaning to keep it for good. Miss one and it is not theft.", ex:"Borrowing a car for a weekend and returning it: no intention to permanently deprive.", m:"A-P-B + D-I"},
{t:"th", h:"Appropriation is a wide word", s:"Acting like an owner, even with the owner’s agreement.", say:"Swapping a price label counts (Morris). A taxi driver who is let take £6 from a wallet appropriates it (Lawrence). Even a valid gift can be appropriated (Hinks). So the real fight is usually about dishonesty.", ex:"A friend gives you £60,000 and you take it. Appropriation. Theft only if dishonest.", m:"Neutral word"},
{t:"th", h:"What can be stolen?", s:"Almost anything of value, but not information or land.", say:"Money, objects, shares, debts and bank balances (things in action) can be stolen. Confidential information cannot (Oxford v Moss). A bank balance is really a debt the bank owes.", ex:"Taking an exam paper’s information: not theft. Draining a bank account: theft of a thing in action.", m:"Rights yes, secrets no"},
{t:"th", h:"“Belonging to another” is broad", s:"Possession, control or a right is enough, even against the owner.", say:"You can steal your own car from a garage that holds it (Turner (No 2)). Money handed to you for a particular legal purpose still belongs to the giver (Davidge v Bunnett), but a moral duty is not enough (Hall).", ex:"Spending a gas bill payment on presents: s 5(3).", m:"Possession beats ownership"},
{t:"th", h:"Dishonesty: Ghosh is out", s:"What did D believe? Then ordinary decent people decide if that is dishonest.", say:"First s 2(1): did D believe he had a legal right, would have had consent, or the owner could not be found? If not, use Ivey. D’s own opinion of whether it was dishonest no longer matters. Barton and Booth confirmed this in criminal cases.", ex:"A man with warped standards used to escape under Ghosh. Not any more.", m:"Facts: his view. Standards: ours."},
{t:"th", h:"Intention to permanently deprive", s:"Meaning to keep it for good, or treating it as your own.", say:"Borrowing is not theft. But if you treat the thing as yours to dispose of, or return it so used up that its value has gone, that counts. Taking money and replacing it is still theft because the notes are not the same (Velumyl).", ex:"Copying films and returning them: no theft (Lloyd). A used season ticket handed back: theft.", m:"Gone for good, or as good as"},
{t:"th", h:"Robbery = theft + force", s:"Slight force, at the time, to steal.", say:"A nudge can be enough (Dawson and James). So can wrenching a basket from a hand (Clouden). Plucking a cigarette is not (RP). Force used while the theft is still going on counts (Hale). Life maximum.", ex:"Push the shop assistant as you leave with the shoes: likely robbery.", m:"Theft, force, in order to"},
{t:"th", h:"Burglary: two ways in", s:"Enter as a trespasser, then either intend or do it.", say:"s 9(1)(a): enter as a trespasser with intent to steal, hurt or damage. s 9(1)(b): enter as a trespasser and then steal or inflict GBH. You need only enter effectively. An arm through a window or a head and an arm can be enough.", ex:"Stuck in a window with head and arm inside (Ryan).", m:"Trespass + intent or deed"},
{t:"th", h:"Trespasser: knowing or reckless", s:"If you reasonably think you are allowed in, you are not a trespasser.", say:"D must know or be reckless as to whether he has permission. An invitation changes the picture (Collins), and the jury must ask whether he had already entered as a trespasser.", ex:"Climbing in a window a friend said you could use: probably not burglary.", m:"Permission matters"},
{t:"th", h:"Fraud Act: the quick version", s:"Three ways to commit fraud, maximum 10 years.", say:"Lying (s 2), keeping quiet when you should speak (s 3), and abusing a position of trust (s 4). Your notes cover this briefly and say more comes next session.", ex:"A director who uses their position to divert company money: s 4.", m:"Lie, hide, abuse"}
);

TABLES.push(
  {t:"th", title:"Theft: elements at a glance", head:["Element","Section","Key cases"], rows:[
    ["Appropriation","s 3","Lawrence; Morris; Gomez; Hinks"],
    ["Property","s 4","Oxford v Moss; Davenport; Kohn"],
    ["Belonging to another","s 5","Turner (No 2); Hall; Davidge v Bunnett"],
    ["Dishonesty","s 2","Feely; Ghosh; Ivey; Barton and Booth"],
    ["Intention to permanently deprive","s 6","Lavender; Cahill; Lloyd; Velumyl"]
  ]},
  {t:"th", title:"The gift cases", head:["Case","Held"], rows:[
    ["Mazo (1997)","A valid gift cannot be stolen (disapproved)"],
    ["Hopkins and Kendrick (1997)","Rejected Mazo: appropriation is neutral and separate from dishonesty"],
    ["Hinks (2000, HL)","A valid gift can be appropriated. Dishonesty is the filter. 3–2 majority"]
  ]},
  {t:"th", title:"Robbery and burglary: key points", head:["Issue","Rule","Case"], rows:[
    ["Level of force (robbery)","Slight, a jury question","Dawson and James"],
    ["Force on the person","Wrenching a basket: yes. Plucking a cigarette: no","Clouden; RP v DPP"],
    ["Timing (robbery)","Appropriation is continuing","Hale; Lockley (extra)"],
    ["Entry (burglary)","Effective, not substantial","Brown; Ryan"],
    ["Trespasser","Knows or reckless as to no permission","Collins"],
    ["Maximums","Robbery: life. Burglary: 14 years (dwelling), 10 otherwise","s 8; s 9"]
  ]},
  {t:"th", title:"Debbie: overall outcome", head:["Event","Likely outcome"], rows:[
    ["£10,000 cheque","Probably not theft: no legal obligation under s 5(3), and dishonesty unlikely"],
    ["Shoes","Theft, probably robbery (Hale). Fraud issue for next session"],
    ["Car","No theft (no intention to permanently deprive). Possible s 12 offence"],
    ["Phone handset","No theft"],
    ["£10 credit","Arguable theft, but dishonesty doubtful"]
  ]}
);

// ---- Additions from the "Offences of dishonesty Part II" slides and handout ----
CARDS.push(
{t:"th", g:"Theft law", n:"Hallam", c:"(1994) (as listed in your lecture)", f:"On your lecture list, but the facts are not in your slides or handout. I could not verify them.", r:"Earlier notes say the CA called theft law in urgent need of simplification and modernisation. Check this against your reading before using it.", h:"Check your reading.", x:true}
);

MCQS.push(
{t:"th", q:"Lecture question: which statement about robbery is FALSE?", o:["Theft is a prerequisite to a conviction for robbery","If D uses force in order to steal, that is robbery","If D steals and uses force after the theft, that is robbery","For robbery, force does not need to involve violence"], a:2, e:"Force after the theft is only robbery if it is still “at the time” of stealing. Hale: appropriation is continuing and the jury decides whether it has finished."},
{t:"th", q:"Lecture question: which BEST describes robbery under s 8 TA 1968?", o:["The threat or use of physical force","Unlawful touching","Trespass","Theft alone"], a:0, e:"Robbery is theft plus the use or threat of force, immediately before or at the time of stealing and in order to steal."},
{t:"th", q:"Lecture question: which is NOT common to burglary under s 9(1)(a) and s 9(1)(b)?", o:["Entry","Trespasser","A building or part of a building","Intent at entry to commit a s 9(2) offence"], a:3, e:"Intent at entry is required only in s 9(1)(a). Section 9(1)(b) needs a theft or GBH, or attempt, after entry."},
{t:"th", q:"Lecture question: which BEST describes the actus reus of burglary under s 9?", o:["Taking property from the building as a trespasser","The intention to enter to commit GBH as a trespasser","Entry to the building as a trespasser","The intention to enter to commit theft as a trespasser"], a:2, e:"The others describe mens rea or the later offence in s 9(1)(b)."},
{t:"th", q:"What is the maximum sentence for a person guilty of robbery or of an assault with intent to rob (s 8(2))?", o:["10 years","14 years","Life imprisonment","7 years"], a:2, e:"On conviction on indictment."},
{t:"th", q:"In Dawson and James, the Court of Appeal said that whether force was used is:", o:["A question of law for the judge","A question of fact for the jury, using common sense","Only satisfied by substantial force","Decided by Parliament"], a:1, e:"The CA chose not to rule on whether the judge was right to require “substantial” force, as the jury found force anyway."},
{t:"th", q:"Under the Larceny Act 1916 robbery used the word “violence”. In the 1968 Act Parliament chose:", o:["Assault","Force","Threat only","Harm"], a:1, e:"On the advice of the CLRC. “Force” is an ordinary word that juries understand."},
{t:"th", q:"In Clouden, the Court of Appeal said the old distinction between force on the person and force on property:", o:["Still applies","Has gone, and the jury decides whether D used force on any person in order to steal","Applies only to pickpockets","Applies to burglary"], a:1, e:"Look at the words of the statute, not the old authorities."},
{t:"th", q:"In Ryan (1996), the court said that for burglary it was:", o:["Necessary that D stole something","Immaterial whether anything was stolen, and D’s partial presence inside was entry under s 9(1)","Necessary that D’s whole body was inside","Not burglary because D was stuck"], a:1, e:"Applying Brown, it is a jury question whether there was entry."},
{t:"th", q:"Fraud Act 2006 s 1: on conviction on indictment, fraud is punishable by up to:", o:["2 years","5 years","10 years","Life"], a:2, e:"Summary: up to 12 months or a fine."},
{t:"th", q:"Fraud under s 4 (abuse of position) requires D to occupy a position in which he is:", o:["Employed full time","Expected to safeguard, or not act against, another person’s financial interests","A company director only","Aged over 18"], a:1, e:"Also dishonest abuse and intent to gain or cause loss or risk of loss. An omission can be an abuse (s 4(2))."},
{t:"th", q:"According to Barton and Booth, why was the Court of Appeal bound to follow Ivey even though Ivey’s remarks on criminal dishonesty were obiter?", o:["Ivey was a criminal case","The Supreme Court was unanimous and expressly said the Ghosh test should no longer be followed, and R v James; R v Karimi supports following it","Parliament had overruled Ghosh","Ghosh had been overturned by the House of Lords"], a:1, e:"Paragraph 104. R v James; R v Karimi [2006] followed a unanimous Privy Council over a House of Lords decision."},
{t:"th", q:"After Barton and Booth, whether D’s belief about the facts was reasonable is:", o:["A separate requirement for the defence","Evidence bearing on whether D genuinely held the belief","Irrelevant","Decided by the judge"], a:1, e:"The more unreasonable the belief, the harder it is to accept D genuinely held it."},
{t:"th", q:"In Barton and Booth, Booth, the general manager, was convicted of:", o:["Theft and fraud","Conspiracy to defraud","Money laundering only","False accounting"], a:1, e:"Barton was convicted of conspiracy to defraud, fraud, theft, false accounting and money laundering."}
);

PLAIN.push(
{t:"th", h:"Barton and Booth in plain English", s:"The Court of Appeal said: use Ivey for dishonesty in crime.", say:"Ivey was a civil case where the Supreme Court said the old two-part dishonesty test was wrong. Defendants argued criminal courts could ignore that because it was only a side comment. The Court of Appeal said no: when the Supreme Court is unanimous and clearly says a test should no longer be used, lower courts follow it.", ex:"A nursing home owner who gets money from vulnerable residents cannot argue that he did not think it was dishonest.", m:"Ivey is the test"},
{t:"th", h:"Does Ryan clarify the law?", s:"Partial entry is enough. How much? A jury decides.", say:"Ryan says a head and one arm in a window counts as entry, and nothing needs to be stolen. That settles that partial entry is enough, but there is still no fixed rule for how much of the body counts. It stays a jury question.", ex:"Compare Brown (arm through a smashed window) with Ryan (head and arm stuck).", m:"Effective, not substantial"}
);

TABLES.push(
  {t:"th", title:"Theft Act 1968 ss 1–9 at a glance", head:["Section","What it covers","Key point"], rows:[
    ["s 1","Theft","Dishonestly appropriates property belonging to another with intention to permanently deprive. No gain needed (s 1(2))"],
    ["s 2","Dishonesty","Three beliefs mean D is not dishonest. Otherwise the Ivey test. Willingness to pay does not stop dishonesty (s 2(2))"],
    ["s 3","Appropriation","Any assumption of the rights of an owner, including a later assumption by keeping or dealing with it as owner"],
    ["s 4","Property","Money and all other property, real or personal, including things in action and intangibles. Limits on land and wild things"],
    ["s 5","Belonging to another","Possession or control, or any proprietary right or interest. s 5(3): property received for a purpose. s 5(4): mistaken receipt"],
    ["s 6","Intention to permanently deprive","Treating the thing as his own to dispose of. s 6(2): pawning"],
    ["s 7","Penalty for theft","Maximum 7 years"],
    ["s 8","Robbery","Theft plus force or threat of force, immediately before or at the time of stealing and in order to steal. Life maximum"],
    ["s 9","Burglary","(1)(a) enter as a trespasser with intent; (1)(b) enter as a trespasser and steal or inflict GBH, or attempt. Building includes inhabited vehicle or vessel"]
  ]},
  {t:"th", title:"Fraud Act 2006 (lecture slides)", head:["Section","Offence","Notes"], rows:[
    ["s 1","Fraud","Committed in three ways (ss 2, 3, 4). Summary: up to 12 months or fine. Indictment: up to 10 years or fine, or both"],
    ["s 2","False representation","Your notes: dishonest false representation intending a gain or loss"],
    ["s 3","Failing to disclose information","Covered briefly"],
    ["s 4","Abuse of position","Position of trust, dishonest abuse, intent to gain or cause loss. Omission can be abuse (s 4(2))"],
    ["s 12","Company officers","Consent or connivance of a director, manager, secretary or similar officer"]
  ]}
);

</script>
<script>
(function(){
"use strict";
const TOPICS = {ar:"Actus reus", mr:"Mens rea", mm:"Murder & manslaughter", im:"DR & involuntary manslaughter", nf:"Non-fatal offences", so:"Sexual offences", th:"Dishonesty & theft"};
const state = {topic:"all", tab:"maps", map:"ar", recall:false, sel:null};
const $ = (s, r) => (r||document).querySelector(s);
function h(tag, attrs, kids){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="text") e.textContent = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]===true) e.setAttribute(k,"");
    else if(attrs[k]!==false && attrs[k]!=null) e.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(c => { if(c==null) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const inTopic = t => state.topic==="all" || state.topic===t;
function badge(t){ return h("span",{class:"badge "+t,text:TOPICS[t]}); }

/* ---------- navigation ---------- */
const TABS = [["maps","Mind maps"],["cases","Case cards"],["mcq","MCQ practice"],["pq","Problem questions"],["plain","Plain English"]];
function buildChrome(){
  const tabs = $("#tabs");
  TABS.forEach(([id,label]) => tabs.append(h("button",{class:"tab",role:"tab",id:"tab-"+id,"aria-selected":"false",text:label,onclick:()=>{ location.hash = id; }})));
  const chips = $("#chips");
  chips.append(h("span",{class:"lab",text:"Topic"}));
  [["all","All"],["ar","Actus reus"],["mr","Mens rea"],["mm","Murder & manslaughter"],["im","DR & involuntary manslaughter"],["nf","Non-fatal offences"],["so","Sexual offences"],["th","Dishonesty & theft"]].forEach(([k,l]) => chips.append(h("button",{class:"chip","data-k":k,"aria-pressed":"false",text:l,onclick:()=>{ state.topic=k; state.sel=null; qs.run=null; ps.open=null; cs.deck=[]; cs.total=0; fixMapChoice(); renderAll(); }})));
}
function fixMapChoice(){ if(!inTopic(state.map)) state.map = state.topic; }
function route(){
  const id = (location.hash||"").slice(1);
  state.tab = TABS.some(t=>t[0]===id) ? id : "maps";
  renderAll();
}
function renderAll(){
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.k===state.topic)));
  TABS.forEach(([id]) => {
    $("#tab-"+id).setAttribute("aria-selected", String(id===state.tab));
    $("#p-"+id).classList.toggle("on", id===state.tab);
  });
  ({maps:renderMaps, cases:renderCases, mcq:renderMcq, pq:renderPq, plain:renderPlain})[state.tab]();
}

/* ---------- mind maps ---------- */
function size(n){ return 1 + (n.c||[]).reduce((a,c)=>a+size(c),0); }
function renderMaps(){
  const p = $("#p-maps"); p.textContent = "";
  p.append(h("p",{class:"intro",text:"Tap a branch to open or close it and read the detail. Dashed italic nodes are cases, monospace nodes are statutes, filled nodes are key tests. Scroll sideways when branches are open. Recall mode hides the detail until you reveal it."}));
  const keys = Object.keys(MAPS).filter(inTopic);
  if(!keys.includes(state.map)) state.map = keys[0];
  const nav = h("div",{class:"mapnav"});
  keys.forEach(k => nav.append(h("button",{class:"chip","aria-pressed":String(k===state.map),text:MAPS[k].title,onclick:()=>{ state.map=k; state.sel=null; renderMaps(); }})));
  const treeHost = h("div",{class:"map"});
  const detail = h("div",{class:"detail","aria-live":"polite"});
  const root = MAPS[state.map].root;
  const kids = root.c || [];
  const split = Math.ceil(kids.length/2);
  const right = h("ul",{class:"side r"}), left = h("ul",{class:"side l"});
  kids.forEach((c,i)=>{
    const colour = "hsl(" + ((i * 47 + 205) % 360) + " 55% var(--bl))";
    (i < split ? right : left).append(mkNode(c, 1, colour, detail));
  });
  const rootBtn = h("button",{class:"node root"},[h("span",{text:root.t})]);
  rootBtn.addEventListener("click",()=>{
    document.querySelectorAll(".node.sel").forEach(x=>x.classList.remove("sel"));
    rootBtn.classList.add("sel"); state.sel = {n:root, colour:""}; showDetail(detail, state.sel);
  });
  const mm = h("div",{class:"mmap"},[left, h("div",{class:"rootcell"},[rootBtn]), right]);
  treeHost.append(mm);
  const ctl = h("div",{class:"row"});
  const rc = h("input",{type:"checkbox",id:"recall"}); rc.checked = state.recall;
  rc.addEventListener("change",()=>{ state.recall = rc.checked; state.sel=null; if(state.recall) setAll(treeHost,false); showDetail(detail,null); });
  ctl.append(nav,
    h("button",{class:"btn",text:"Expand all",onclick:()=>{ setAll(treeHost,true); rootBtn.scrollIntoView({block:"center",inline:"center"}); }}),
    h("button",{class:"btn",text:"Collapse all",onclick:()=>setAll(treeHost,false)}),
    h("label",{class:"toggle"},[rc, "Recall mode"]));
  p.append(ctl, h("div",{class:"legend"},[ h("span",{text:"Case (dashed)"}), h("span",{text:"Statute (mono)"}), h("span",{text:"Key test (filled)"}), h("span",{text:"“added” = not in your notes"}) ]), treeHost, detail);
  showDetail(detail, null);
  if(state.recall) setAll(treeHost,false);
}
function mkNode(n, depth, colour, detail){
  const li = h("li");
  const hasKids = n.c && n.c.length;
  li.style.setProperty("--b", colour);
  const cls = "node" + (depth===1?" top":"") + (n.k?" "+n.k:"");
  const btn = h("button",{class:cls,"aria-expanded":hasKids?"false":null},[
    h("span",{class:"chev",text:hasKids ? "+" : "·"}),
    h("span",{text:n.t}),
    n.x ? h("span",{class:"xb",text:"added"}) : null
  ]);
  btn.addEventListener("click",()=>{
    if(hasKids){
      const open = li._ul.style.display === "none";
      li._ul.style.display = open ? "" : "none";
      btn.setAttribute("aria-expanded",String(open));
      btn.firstChild.textContent = open ? "–" : "+";
    }
    document.querySelectorAll(".node.sel").forEach(x=>x.classList.remove("sel"));
    btn.classList.add("sel");
    try{ btn.scrollIntoView({block:"nearest",inline:"nearest"}); }catch(e){}
    state.sel = {n, colour};
    showDetail(detail, state.sel);
  });
  li.append(btn);
  if(hasKids){
    const ul = h("ul");
    ul.style.display = "none";
    n.c.forEach(c => ul.append(mkNode(c, depth+1, colour, detail)));
    li.append(ul);
    li._ul = ul;
  }
  return li;
}
function setAll(host, open){
  host.querySelectorAll("li").forEach(li => {
    if(!li._ul) return;
    li._ul.style.display = open ? "" : "none";
    const b = li.firstChild; b.setAttribute("aria-expanded",String(open)); b.firstChild.textContent = open?"–":"+";
  });
}
function showDetail(box, sel){
  box.textContent = "";
  box.style.setProperty("--b", sel && sel.colour ? sel.colour : "var(--accent)");
  if(!sel){ box.append(h("p",{class:"muted",text: state.recall ? "Recall mode: pick a node, say what you remember, then reveal." : "Select a node to read about it."})); return; }
  box.append(h("h3",{text:sel.n.t}));
  const body = sel.n.d || (sel.n.c ? "Open this branch to see what sits under it." : "");
  if(state.recall && sel.n.d){
    const slot = h("div");
    slot.append(h("button",{class:"btn primary",text:"Reveal",onclick:()=>{ slot.textContent=""; slot.append(h("p",{text:sel.n.d})); }}));
    box.append(slot);
  } else box.append(h("p",{text:body}));
}

/* ---------- case cards ---------- */
const cs = {mode:"browse", q:"", deck:[], i:0, shown:false, done:0, total:0};
function filteredCards(){
  const q = cs.q.trim().toLowerCase();
  return CARDS.filter(c => (inTopic(c.t) || (c.also||[]).some(inTopic)) && (!q || (c.n+" "+c.c+" "+c.g+" "+c.f+" "+c.r+" "+c.h).toLowerCase().includes(q)));
}
function renderCases(){
  const p = $("#p-cases"); p.textContent = "";
  p.append(h("p",{class:"intro",text:"Every case in your notes with the facts, the rule and a hook to remember it. Browse them, or run the deck and mark each as known or needs another go."}));
  const search = h("input",{class:"search",type:"search",placeholder:"Search cases, e.g. causation, Woollin",value:cs.q,"aria-label":"Search cases"});
  search.addEventListener("input",()=>{ cs.q = search.value; if(cs.mode==="browse") drawBrowse(); });
  const row = h("div",{class:"row"},[search,
    h("button",{class:"btn"+(cs.mode==="browse"?" dark-btn":""),text:"Browse",onclick:()=>{ cs.mode="browse"; renderCases(); }}),
    h("button",{class:"btn"+(cs.mode==="deck"?" dark-btn":""),text:"Test deck",onclick:()=>{ startDeck(); renderCases(); }})]);
  const host = h("div",{id:"casehost"});
  p.append(row, host);
  cs.mode==="browse" ? drawBrowse() : drawDeck();
}
function caseCard(c, full){
  return h("article",{class:"case-card "+c.t},[
    h("div",{class:"grp"},[badge(c.t), " "+c.g]),
    h("h3",{text:c.n}),
    h("div",{class:"cite",text:c.c}),
    full ? h("p",{},[h("span",{class:"lab",text:"Facts"}), c.f]) : null,
    full ? h("p",{},[h("span",{class:"lab",text:"Rule"}), c.r]) : null,
    full ? h("p",{class:"hook"},[h("span",{class:"lab",text:"Hook"}), c.h]) : null,
    c.x ? h("div",{},[h("span",{class:"badge x",text:"added, not in your notes"})]) : null
  ]);
}
function drawBrowse(){
  const host = $("#casehost"); host.textContent = "";
  const list = filteredCards();
  if(!list.length){ host.append(h("div",{class:"empty",text:"No cases match."})); return; }
  host.append(h("p",{class:"intro",text:list.length+" cases"}));
  const grid = h("div",{class:"cardgrid"}); list.forEach(c => grid.append(caseCard(c,true))); host.append(grid);
}
function startDeck(){ cs.mode="deck"; cs.deck = shuffle(filteredCards()); cs.i=0; cs.shown=false; cs.done=0; cs.total=cs.deck.length; }
function drawDeck(){
  const host = $("#casehost"); host.textContent = "";
  if(!cs.deck.length && !cs.total){ startDeck(); }
  const wrap = h("div",{class:"deck"});
  const pct = cs.total ? Math.round(cs.done/cs.total*100) : 0;
  const bar = h("div",{class:"progress"},[h("i")]); bar.firstChild.style.width = pct+"%";
  wrap.append(h("div",{class:"qmeta"},[h("span",{text:cs.done+" of "+cs.total+" known"}), h("span",{text:cs.deck.length+" left"})]), bar);
  if(!cs.deck.length){
    wrap.append(h("div",{class:"face"},[h("h2",{text:"Deck complete"}),h("p",{text:"You marked all "+cs.total+" cases as known."}),h("div",{class:"actions"},[h("button",{class:"btn primary",text:"Go again",onclick:()=>{ startDeck(); drawDeck(); }})])]));
    host.append(wrap); return;
  }
  const c = cs.deck[0];
  const face = h("div",{class:"face "+c.t},[
    h("div",{class:"grp"},[badge(c.t), " "+c.g]),
    h("h2",{text:c.n}),
    h("div",{class:"cite",text:c.c})
  ]);
  if(!cs.shown){
    face.append(h("p",{class:"muted",text:"What were the facts, and what is the rule?"}));
    wrap.append(face, h("div",{class:"actions"},[h("button",{class:"btn primary",text:"Show answer",onclick:()=>{ cs.shown=true; drawDeck(); }})]));
  } else {
    face.append(h("p",{},[h("span",{class:"lab",text:"Facts"}), c.f]), h("p",{},[h("span",{class:"lab",text:"Rule"}), c.r]), h("p",{class:"hook"},[h("span",{class:"lab",text:"Hook"}), c.h]));
    wrap.append(face, h("div",{class:"actions"},[
      h("button",{class:"btn",text:"Needs another go",onclick:()=>{ cs.deck.push(cs.deck.shift()); cs.shown=false; drawDeck(); }}),
      h("button",{class:"btn primary",text:"Got it",onclick:()=>{ cs.deck.shift(); cs.done++; cs.shown=false; drawDeck(); }})]));
  }
  host.append(wrap);
}

/* ---------- MCQ ---------- */
const qs = {run:null};
function renderMcq(){
  const p = $("#p-mcq"); p.textContent = "";
  const pool = MCQS.filter(q => inTopic(q.t));
  p.append(h("p",{class:"intro",text:"Single best answer. Pick an option to see why it is right or wrong. Questions and options are shuffled each run."}));
  if(!qs.run){
    p.append(h("div",{class:"row"},[
      h("button",{class:"btn primary",text:"Start all "+pool.length+" questions",onclick:()=>startQuiz(pool.length)}),
      h("button",{class:"btn",text:"Quick 10",disabled: pool.length<1,onclick:()=>startQuiz(Math.min(10,pool.length))})]));
    return;
  }
  drawQuiz(p);
}
function startQuiz(n, only){
  const src = only || MCQS.filter(q => inTopic(q.t));
  const picked = shuffle(src).slice(0,n).map(q => {
    const opts = shuffle(q.o.map((text,i)=>({text, ok:i===q.a})));
    return {q, opts, chosen:null};
  });
  qs.run = {items:picked, i:0, score:0, done:false};
  renderMcq();
}
function drawQuiz(p){
  const r = qs.run; const box = h("div",{class:"quiz"});
  if(r.done){
    const missed = r.items.filter(x => !x.opts[x.chosen].ok);
    box.append(h("div",{class:"qbox"},[
      h("div",{class:"score",text:r.score+" / "+r.items.length}),
      h("p",{text: missed.length ? "Review the ones you missed:" : "Clean sweep."}),
      h("ul",{class:"missed"}, missed.map(x => h("li",{},[h("strong",{text:x.q.q}), h("br"), "Answer: "+x.q.o[x.q.a]+". "+x.q.e]))),
      h("div",{class:"row"},[
        missed.length ? h("button",{class:"btn primary",text:"Retry missed ("+missed.length+")",onclick:()=>startQuiz(missed.length, missed.map(x=>x.q))}) : null,
        h("button",{class:"btn",text:"New quiz",onclick:()=>{ qs.run=null; renderMcq(); }})])]));
    p.append(box); return;
  }
  const it = r.items[r.i];
  const bar = h("div",{class:"progress"},[h("i")]); bar.firstChild.style.width = Math.round(r.i/r.items.length*100)+"%";
  const q = h("div",{class:"qbox"},[
    h("div",{class:"qmeta"},[h("span",{},[badge(it.q.t)," Question "+(r.i+1)+" of "+r.items.length]), h("span",{text:"Score "+r.score})]),
    h("p",{class:"qtext",text:it.q.q})]);
  const opts = h("div",{class:"opts"});
  it.opts.forEach((o,idx) => {
    const b = h("button",{class:"opt",onclick:()=>choose(idx)},[h("span",{class:"l",text:"ABCD"[idx]}), h("span",{text:o.text})]);
    if(it.chosen!==null){
      b.disabled = true;
      if(o.ok) b.classList.add("right"); else if(idx===it.chosen) b.classList.add("wrong");
    }
    opts.append(b);
  });
  q.append(opts);
  if(it.chosen!==null){
    const ok = it.opts[it.chosen].ok;
    q.append(h("div",{class:"fb"},[h("strong",{class:ok?"g":"b",text: ok ? "Correct. " : "Not quite. "}), it.q.e]));
    q.append(h("div",{class:"row",style:"margin-top:12px"},[h("button",{class:"btn primary",text: r.i+1<r.items.length ? "Next question" : "See score",onclick:()=>{ if(r.i+1<r.items.length) r.i++; else r.done=true; renderMcq(); }})]));
  }
  box.append(bar,q); p.append(box);
  function choose(idx){ if(it.chosen!==null) return; it.chosen=idx; if(it.opts[idx].ok) r.score++; renderMcq(); }
}

/* ---------- problem questions ---------- */
const ps = {open:null, shown:0};
function renderPq(){
  const p = $("#p-pq"); p.textContent = "";
  if(ps.open){ drawPq(p, PQS.find(x=>x.id===ps.open)); return; }
  p.append(h("p",{class:"intro",text:"Scenario questions in the style of your seminars. Read the facts, write your own answer, then reveal the model outline one step at a time."}));
  const list = PQS.filter(x => inTopic(x.t));
  if(!list.length){ p.append(h("div",{class:"empty",text:"No problem questions for this topic yet."})); return; }
  const grid = h("div",{class:"pqlist"});
  list.forEach(q => grid.append(h("button",{class:"pqcard "+q.t,onclick:()=>{ ps.open=q.id; ps.shown=0; window.__pqText=""; renderPq(); }},[
    h("div",{},[badge(q.t)]), h("h3",{text:q.title}), h("div",{class:"tags"}, q.tags.map(t=>h("span",{class:"tag",text:t})))])));
  p.append(grid);
}
function drawPq(p, q){
  const v = h("div",{class:"pqview"});
  v.append(h("div",{class:"row"},[h("button",{class:"btn",text:"All questions",onclick:()=>{ ps.open=null; renderPq(); }}), badge(q.t)]),
    h("h2",{text:q.title,style:"margin-bottom:10px"}),
    h("div",{class:"facts",text:q.facts}),
    h("p",{class:"intro",style:"margin-top:12px",text:q.task}));
  const ta = h("textarea",{placeholder:"Write your answer here first (not saved)","aria-label":"Your answer"});
  v.append(ta);
  const steps = h("div");
  q.steps.slice(0, ps.shown).forEach(s => steps.append(h("div",{class:"step"},[h("h3",{text:s.h}), h("ul",{}, s.p.map(x=>h("li",{text:x})))])));
  const more = ps.shown < q.steps.length;
  v.append(h("div",{class:"row"},[
    h("button",{class:"btn primary",text: ps.shown===0 ? "Reveal first step" : (more ? "Reveal next step" : "All steps shown"),disabled:!more,onclick:()=>{ ps.shown++; renderPq(); }}),
    more ? h("button",{class:"btn",text:"Show full outline",onclick:()=>{ ps.shown=q.steps.length; renderPq(); }}) : null]), steps);
  p.append(v);
  const keep = $("#p-pq textarea"); if(keep && window.__pqText!=null) keep.value = window.__pqText;
  keep.addEventListener("input",()=>{ window.__pqText = keep.value; });
}

/* ---------- plain English ---------- */
function renderPlain(){
  const p = $("#p-plain"); p.textContent = "";
  p.append(h("p",{class:"intro",text:"The theory in everyday terms, one idea per card, each with an example and a memory hook."}));
  TABLES.filter(x=>inTopic(x.t)).forEach(tb => {
    const t = h("table",{class:"cmp"});
    t.append(h("thead",{},[h("tr",{}, tb.head.map(x=>h("th",{text:x})))]));
    t.append(h("tbody",{}, tb.rows.map(r => h("tr",{}, r.map((c,i)=> i===0 ? h("th",{text:c}) : h("td",{text:c}))))));
    p.append(h("h2",{text:tb.title,style:"margin-bottom:8px"}), h("div",{class:"tablewrap"},[t]));
  });
  const grid = h("div",{class:"plaingrid"});
  PLAIN.filter(x=>inTopic(x.t)).forEach(x => grid.append(h("article",{class:"pcard "+x.t},[
    h("div",{},[badge(x.t)]), h("h3",{text:x.h}), h("p",{class:"s",text:x.s}), h("p",{text:x.say}), h("p",{class:"ex",text:"Example: "+x.ex}), h("div",{class:"m",text:x.m})])));
  p.append(grid);
}

buildChrome();
window.addEventListener("hashchange", route);
route();
})();
