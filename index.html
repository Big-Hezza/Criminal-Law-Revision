<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criminal Law Revision Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with topic filter + tabs, single content column, mind map with sticky detail panel */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#eaeef2; --ink:#14212b; --muted:#566673; --line:#d3dbe1;
  --ar:#1f5fa8; --mr:#8c3b73; --mm:#b42342; --nf:#a15a00; --so:#5b4bb7; --th:#0b7285; --accent:#0d6b63; --case:#8f5600; --good:#17703e; --bad:#b3261e; --warn:#8f5600;
  --good-bg:#e3f3ea; --bad-bg:#fbe7e5; --focus:#0d6b63; --bl:40%;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f171d; --surface:#17222a; --surface2:#1f2d37; --ink:#e6edf1; --muted:#9db0bc; --line:#2c3d49;
    --ar:#6ea8ec; --mr:#d788bd; --mm:#ff8aa1; --nf:#f0a860; --so:#a99cf5; --th:#5ccfe6; --accent:#4cc2b6; --case:#e0a24a; --good:#5ccf8d; --bad:#ff8f86; --warn:#e0a24a;
    --good-bg:#15301f; --bad-bg:#3a1c1a; --focus:#4cc2b6; --bl:68%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#17222a; --surface2:#1f2d37; --ink:#e6edf1; --muted:#9db0bc; --line:#2c3d49;
  --ar:#6ea8ec; --mr:#d788bd; --mm:#ff8aa1; --nf:#f0a860; --so:#a99cf5; --th:#5ccfe6; --accent:#4cc2b6; --case:#e0a24a; --good:#5ccf8d; --bad:#ff8f86; --warn:#e0a24a;
  --good-bg:#15301f; --bad-bg:#3a1c1a; --focus:#4cc2b6; --bl:68%; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{padding-top:12px;padding-bottom:10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{font-size:1.35rem}
.brand span{color:var(--muted);font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;white-space:nowrap;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected="true"]){background:var(--surface2)}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips .lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
main{padding:20px 0 60px}
.panel{display:none}.panel.on{display:block}
.intro{color:var(--muted);max-width:68ch;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.dark-btn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem}
.toggle input{width:18px;height:18px}
.badge{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;font-weight:600;color:var(--bg)}
.badge.ar{background:var(--ar)}.badge.mr{background:var(--mr)}.badge.mm{background:var(--mm)}.badge.nf{background:var(--nf)}.badge.so{background:var(--so)}.badge.th{background:var(--th)}
.badge.x{background:var(--warn);color:var(--bg)}

/* mind map: centre root, branches spread left and right, children centred on their parent */
.mapnav{display:flex;gap:6px;flex-wrap:wrap}
.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 14px;overflow:auto;display:flex;max-height:75vh}
.mmap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 auto;flex:none}
.mmap ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mmap li{position:relative;display:flex;align-items:center;padding:5px 0}
.side.r li{padding-left:26px}
.side.l li{flex-direction:row-reverse;padding-right:26px}
.side.l{align-items:flex-end}
.mmap li::before{content:"";position:absolute;top:50%;width:26px;border-top:2px solid var(--b,var(--line))}
.side.r li::before{left:0}.side.l li::before{right:0}
.mmap li::after{content:"";position:absolute;top:0;bottom:0;border-left:2px solid var(--b,var(--line))}
.side.r li::after{left:0}.side.l li::after{right:0}
.mmap li:first-child::after{top:50%}.mmap li:last-child::after{bottom:50%}
.mmap li:only-child::after{display:none}
.mmap li>ul{position:relative}
.side.r li>ul{margin-left:22px}.side.l li>ul{margin-right:22px}
.mmap li>ul::before{content:"";position:absolute;top:50%;width:22px;border-top:2px solid var(--b,var(--line))}
.side.r li>ul::before{left:-22px}.side.l li>ul::before{right:-22px}
.mmap .rootcell{position:relative;padding:0 26px}
.mmap .rootcell::before,.mmap .rootcell::after{content:"";position:absolute;top:50%;width:26px;border-top:2px solid var(--muted)}
.mmap .rootcell::before{left:0}.mmap .rootcell::after{right:0}
.node{display:inline-flex;align-items:center;gap:7px;max-width:230px;text-align:left;border:1.5px solid var(--b,var(--line));background:var(--surface);border-radius:9px;padding:6px 10px;line-height:1.3;font-size:.92rem}
.side.l .node{text-align:right;flex-direction:row-reverse}
.node:hover{background:var(--surface2)}
.node .chev{width:12px;display:inline-block;font-family:var(--mono);color:var(--muted);flex:none;text-align:center}
.node.case{font-style:italic;border-style:dashed;color:var(--case)}
.node.stat{font-family:var(--mono);font-size:.8rem}
.node.key{background:var(--b,var(--accent));color:var(--bg);border-color:var(--b,var(--accent));font-weight:600}
.node.top{font-weight:600;border-width:2px}
.node.sel{box-shadow:0 0 0 3px color-mix(in srgb, var(--b,var(--accent)) 35%, transparent)}
.node.root{font-family:var(--display);font-size:1.1rem;font-weight:600;background:var(--ink);color:var(--bg);border-color:var(--ink);max-width:200px;text-align:center;justify-content:center;padding:14px 16px;border-radius:14px}
.node .xb{font-size:.62rem;text-transform:uppercase;border-radius:4px;background:var(--warn);color:var(--bg);padding:1px 5px;font-style:normal;font-family:var(--body)}
.detail{position:sticky;bottom:10px;margin-top:14px;background:var(--surface);border:1.5px solid var(--b,var(--accent));border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-height:70px}
.detail h3{font-size:1.05rem;margin-bottom:4px}
.detail p{margin:0;max-width:75ch}
.detail .muted{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin:0 0 10px}

/* cards */
.search{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;min-width:220px;flex:1;max-width:340px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.case-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ar);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.case-card.mr{border-left-color:var(--mr)}.case-card.mm{border-left-color:var(--mm)}.case-card.nf{border-left-color:var(--nf)}.case-card.so{border-left-color:var(--so)}.case-card.th{border-left-color:var(--th)}
.case-card h3{font-size:1.05rem;font-style:italic}
.case-card .cite{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.case-card .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.case-card p{margin:0;font-size:.92rem}
.case-card .lab{font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block}
.case-card .hook{background:var(--surface2);border-radius:6px;padding:4px 8px;font-size:.88rem}
.deck{max-width:640px;margin:0 auto}
.deck .face{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;min-height:260px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--ar)}
.deck .face.mr{border-top-color:var(--mr)}.deck .face.mm{border-top-color:var(--mm)}.deck .face.nf{border-top-color:var(--nf)}.deck .face.so{border-top-color:var(--so)}.deck .face.th{border-top-color:var(--th)}
.deck .face h2{font-size:1.7rem;font-style:italic}
.progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.deck .actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.hidden{display:none!important}

/* mcq */
.quiz{max-width:720px;margin:0 auto}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:1.25rem;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .l{font-weight:700;width:1.3em;flex:none}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface2)}
.fb strong.g{color:var(--good)}.fb strong.b{color:var(--bad)}
.score{font-family:var(--display);font-size:2.4rem}
.missed li{margin:6px 0}

/* problem questions */
.pqlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pqcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ar);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.pqcard.mr{border-left-color:var(--mr)}.pqcard.mm{border-left-color:var(--mm)}.pqcard.nf{border-left-color:var(--nf)}.pqcard.so{border-left-color:var(--so)}.pqcard.th{border-left-color:var(--th)}
.pqcard:hover{border-color:var(--ink)}
.pqcard h3{font-size:1.1rem}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.72rem;background:var(--surface2);padding:2px 8px;border-radius:99px;color:var(--muted)}
.pqview .facts{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:1.02rem;max-width:78ch}
.pqview textarea{width:100%;min-height:150px;margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0;max-width:78ch}
.step h3{font-size:1rem;margin-bottom:6px}
.step ul{margin:0;padding-left:20px}.step li{margin:4px 0}

/* plain english */
.plaingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ar);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pcard.mr{border-top-color:var(--mr)}.pcard.mm{border-top-color:var(--mm)}.pcard.nf{border-top-color:var(--nf)}.pcard.so{border-top-color:var(--so)}.pcard.th{border-top-color:var(--th)}
.pcard h3{font-size:1.1rem}
.pcard .s{font-weight:600}
.pcard p{margin:0;font-size:.93rem}
.pcard .ex{border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}
.pcard .m{font-family:var(--mono);font-size:.8rem;background:var(--surface2);border-radius:6px;padding:5px 8px}
.tablewrap{overflow-x:auto;margin:0 0 20px}
table.cmp{border-collapse:collapse;min-width:640px;width:100%;background:var(--surface)}
.cmp th,.cmp td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top;font-size:.92rem}
.cmp th{background:var(--surface2);font-family:var(--display)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media (max-width:520px){.qtext{font-size:1.1rem}.deck .face h2{font-size:1.4rem}}
@media (prefers-reduced-motion: no-preference){.node,.opt,.btn{transition:background .15s,border-color .15s}}

.lab{display:block;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.cite{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.muted{color:var(--muted)}
.deck .face p{margin:0}.deck .face .hook{background:var(--surface2);border-radius:6px;padding:6px 10px}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Criminal Law Revision Hub</h1><span>England and Wales · Actus reus, mens rea, homicide, non-fatal, sexual and property offences</span></div>
    <div class="bar">
      <div class="tabs" id="tabs" role="tablist" aria-label="Revision tools"></div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="panel" id="p-maps" role="tabpanel" aria-labelledby="tab-maps"></section>
  <section class="panel" id="p-cases" role="tabpanel" aria-labelledby="tab-cases"></section>
  <section class="panel" id="p-mcq" role="tabpanel" aria-labelledby="tab-mcq"></section>
  <section class="panel" id="p-pq" role="tabpanel" aria-labelledby="tab-pq"></section>
  <section class="panel" id="p-plain" role="tabpanel" aria-labelledby="tab-plain"></section>
</main>
<script>
// Mind map trees. Node: {t:title, d:detail, k:'case'|'stat'|'key', x:true if not in notes, c:[children]}
const MAPS = {
ar: {
  title: "Actus reus",
  root: {t:"Actus reus", d:"The physical (external) element of an offence. A crime is actus reus + mens rea + no defence, and the two elements normally have to coincide.", c:[
    {t:"What AR can include", d:"Always ask which of these three the offence in the question needs.", c:[
      {t:"Conduct", d:"An act or an omission."},
      {t:"Result (consequences)", d:"A prohibited outcome caused by D, such as death in murder."},
      {t:"Surrounding circumstances", d:"Facts that must exist, such as property ‘belonging to another’ in criminal damage."}
    ]},
    {t:"Three types of crime", c:[
      {t:"Conduct crimes", d:"Complete once the prohibited act is done, whether or not any harm follows."},
      {t:"Result crimes", d:"Need proof that D’s conduct caused a specific prohibited consequence. Causation rules matter here."},
      {t:"State of affairs crimes", d:"Liability rests on a situation or condition, not a voluntary act. D need not have done anything voluntarily.", c:[
        {t:"Winzar v CC Kent (1983)", k:"case", d:"Taken to hospital drunk, D was moved to the roadside by police, then arrested for being found drunk on the highway. Convicted: the offence is the state of being there."},
        {t:"s.4 RTA 1988", k:"stat", d:"Being in charge of a vehicle while unfit through drink or drugs. The circumstances existing is enough."},
        {t:"s.1 Prevention of Crime Act 1953", k:"stat", d:"Possessing an offensive weapon in a public place. Possession is the state of affairs."}
      ]}
    ]},
    {t:"Voluntariness", d:"Conduct must generally be voluntary. Involuntary movement means no actus reus.", c:[
      {t:"Hill v Baxter [1958]", k:"case", d:"Authority for involuntary acts negating AR (automatism). Examples given: a swarm of bees in the car, a stone through the windscreen."},
      {t:"Exception: state of affairs crimes", d:"No voluntary conduct needed, only the circumstances."}
    ]},
    {t:"Omissions", d:"General rule: no liability for failing to act. There is no duty of easy rescue: a stranger can walk past someone drowning in shallow water. Liability needs a recognised legal duty. Mnemonic: SPACE.", c:[
      {t:"S: Statute", d:"A statute imposes the duty.", c:[
        {t:"s.5 DVCVA 2004", k:"stat", d:"Household members with frequent contact owe a duty to protect a child or vulnerable adult from foreseeable death or serious harm."}
      ]},
      {t:"P: Public / official position", d:"Holding a public office can create a duty to act.", c:[
        {t:"Dytham [1979]", k:"case", x:true, d:"Police officer stood by while a man was beaten and killed outside a club. Liable for wilful misconduct in public office. Not in your notes: added from the seminar answer’s mention of ‘official position’."}
      ]},
      {t:"A: Assumption of responsibility", d:"Voluntarily taking on care of a vulnerable person creates a binding duty.", c:[
        {t:"Gibbins and Proctor (1918)", k:"case", d:"Child starved to death. Both convicted of murder. Proctor had taken money from Gibbins to feed the child, so she had assumed responsibility."},
        {t:"Stone and Dobinson [1977]", k:"case", d:"Elderly, ill relative lodged with them. They took her in, then failed to get help as she declined, and she died. Voluntary assumption of care created the duty. Gross negligence manslaughter."}
      ]},
      {t:"C: Contract", d:"A contractual duty can ground criminal liability for omission.", c:[
        {t:"Pittwood (1902)", k:"case", d:"Railway gatekeeper left the gate open, and a person crossing was killed by a train. His contract created the duty."},
        {t:"Lifeguard on duty", d:"Seminar example: a lifeguard’s contract of employment creates a duty to rescue swimmers in distress. Pittwood by analogy."}
      ]},
      {t:"E: Engineered the danger", d:"If D creates a dangerous situation, even accidentally, and becomes aware of it, D must take reasonable steps to counteract it.", c:[
        {t:"Miller [1983] 2 AC 161", k:"case", d:"Squatter fell asleep with a lit cigarette, woke to a smouldering mattress, moved rooms and left it. Fire damage. Liable for arson (CDA 1971 s.1) via the duty from creating the danger."}
      ]},
      {t:"Medical omissions", d:"Withdrawing life-sustaining treatment that is no longer in the patient’s best interests is a lawful omission.", c:[
        {t:"Airedale NHS Trust v Bland [1993]", k:"case", d:"Patient in a persistent vegetative state. Doctors could lawfully stop artificial feeding as continuing was not in his best interests."}
      ]}
    ]},
    {t:"Causation", d:"Needed for result crimes. Three questions in order: factual, legal, then did anything break the chain?", c:[
      {t:"1. Factual: ‘but for’", d:"But for D’s act or omission, would the result have happened as and when it did? If yes, D is not the factual cause.", c:[
        {t:"White (1910)", k:"case", d:"D put poison in his mother’s drink to kill her. She died of heart failure before it took effect. Not the factual cause, so not guilty of murder."},
        {t:"Mitchell (1983)", k:"case", d:"D punched a man in a queue. He fell onto an elderly woman who was injured and later died. But for the punch, no death."}
      ]},
      {t:"2. Legal: operating and substantial", d:"D’s conduct must be an operating and substantial cause. It need not be the only cause.", c:[
        {t:"Pagett (1983)", k:"case", d:"D used his pregnant girlfriend as a shield against armed police. She was shot dead by police return fire. D’s act remained a substantial cause."},
        {t:"Smith [1959]", k:"case", d:"Soldier stabbed, then dropped twice and given poor treatment. The stab wound was still an operating and substantial cause."}
      ]},
      {t:"Thin skull rule", d:"Take your victim as you find them. Pre-existing weakness, even a belief, does not break the chain.", c:[
        {t:"Hayward (1908)", k:"case", d:"D threatened his wife, who ran out and died because of an abnormal thymus condition. D liable."},
        {t:"Blaue [1975]", k:"case", d:"Jehovah’s Witness stabbed, refused a blood transfusion on religious grounds and died. D liable. The refusal did not break the chain."},
        {t:"Smith v Leech Brain [1962]", k:"case", d:"Civil (tort) case. A burn to the lip triggered cancer in pre-malignant tissue. Useful for the principle, but cite Hayward or Blaue in a criminal answer."}
      ]},
      {t:"3. Novus actus interveniens", d:"A new intervening act can break the chain. Ask: is it free, voluntary and informed? Is it reasonably foreseeable? Is it so independent that D’s act is only background?", c:[
        {t:"Victim escapes", d:"The chain stays intact if the escape was foreseeable and a reasonable reaction to D’s conduct. An unforeseeable or disproportionate escape breaks it.", c:[
          {t:"Roberts (1972)", k:"case", d:"Girl jumped from a moving car to escape sexual advances and was injured. D liable. The test is whether the reaction was within the range to be expected."},
          {t:"Williams and Davies (1992)", k:"case", d:"Hitchhiker jumped from a moving car and died. Conviction quashed as the response must be reasonably foreseeable and proportionate to the threat."},
          {t:"Corbett (1996)", k:"case", d:"Vulnerable victim fled after an attack and was hit by a car. D liable."},
          {t:"Marjoram (2000)", k:"case", d:"Victim jumped from a window to escape intruders. D liable. The reaction was foreseeable."}
        ]},
        {t:"Third party or victim", d:"A fully voluntary, informed act by a third party or the victim breaks the chain. Self-neglect usually does not.", c:[

mr: {
  title: "Mens rea",
  root: {t:"Mens rea", d:"‘Guilty mind’: the fault element of an offence. Three levels from most to least culpable: intention, recklessness, negligence.", c:[
    {t:"Overview", c:[
      {t:"Some offences need more than one MR", d:"Theft needs dishonesty and intention to permanently deprive."},
      {t:"Levels of fault", d:"Intention > recklessness > negligence. Intention and recklessness are subjective (what D thought). Negligence is objective (what a reasonable person would do)."},
      {t:"MR for murder: malice aforethought", d:"Intention to kill or cause GBH. Recklessness is not enough. Most oblique intent cases are murder cases.", c:[
        {t:"Vickers [1957]", k:"case", d:"Intention to cause GBH is enough for the murder mens rea."},
        {t:"Cunningham [1982] AC 566", k:"case", d:"Confirmed GBH intent is enough for murder. Not the same case as Cunningham (1957) on recklessness."}
      ]}
    ]},
    {t:"Intention", d:"The most culpable form. Two types.", c:[
      {t:"Direct intent", d:"D’s aim or purpose. The consequence is desired. The jury uses ordinary meaning and common sense.", c:[
        {t:"Mohan [1976]", k:"case", d:"Intention is a decision to bring about the result, whether or not D desires it for its own sake. D drove at a police officer."}
      ]},
      {t:"Oblique (indirect) intent", d:"Not D’s aim, but D knows the result is virtually certain. The jury may find intention. Two issues: how much foresight (virtual certainty) and whether foresight is intention or only evidence of it (evidence).", c:[
        {t:"Woollin test", k:"key", d:"The jury may find intention if they are sure that (1) death or serious harm was a virtual certainty as a result of D’s actions, and (2) D appreciated that. Remember VC + A."},
        {t:"Rule of evidence, not substantive law", d:"Foresight is something the jury may use to find intention. They are not forced to. Confirmed in Matthews and Alleyne."},
        {t:"Re A (Conjoined Twins) [2000]", k:"case", d:"Doctors’ aim was to save Jodie but they knew separation would kill Mary. Their purpose was not Mary’s death, so oblique intent and necessity were the issues. Not murder."},
        {t:"Inglis [2011]", k:"case", d:"Mother injected her brain-damaged son with heroin to end his suffering. Convicted of murder. Motive is irrelevant to intent."}
      ]}
    ]},
    {t:"Oblique intent timeline", d:"The law moved from objective presumption, to probability, to virtual certainty. Mnemonic: Smith, Hyam, Moloney, Hancock, Nedrick, Woollin.", c:[
      {t:"DPP v Smith [1961]", k:"case", d:"Police officer clung to D’s car and was killed when D drove erratically. HL applied an irrebuttable objective presumption: D intends the natural and probable consequences. D’s own state of mind did not matter."},
      {t:"s.8 CJA 1967", k:"stat", d:"Parliament’s response. A court or jury is not bound to infer intent or foresight just because a result was a natural and probable consequence, and must look at all the evidence."},
      {t:"Hyam v DPP [1975]", k:"case", d:"D poured petrol through a letterbox and lit it. Two children died. HL: foresight of death or GBH as ‘highly probable’ was enough. Too close to recklessness for murder."},
      {t:"Moloney [1985]", k:"case", d:"D shot his stepfather after a taunting contest. Foresight is evidence of intention, not intention. Lord Bridge’s two questions: was death or serious injury a natural consequence, and did D foresee it as one? The first is objective, arguably against s.8. Note: your notes also spell it ‘Maloney’."},
      {t:"Hancock and Shankland [1986]", k:"case", d:"Miners pushed a concrete block off a bridge, killing a taxi driver. The Moloney guidelines were misleading. ‘Natural’ is not ‘probable’. The greater the probability, the more likely it was foreseen (Lord Scarman)."},
      {t:"Nedrick [1986] (CA)", k:"case", d:"D set fire to a house through the letterbox and a child died. Lord Lane’s direction: the jury is not entitled to infer intention unless sure death or serious harm was a virtual certainty and D appreciated this. A move from probability to certainty."},
      {t:"Woollin [1999] (HL)", k:"case", d:"D threw his baby across the room and it died. Approved Nedrick. A direction on ‘substantial risk’ was a misdirection because it blurred intention and recklessness."},
      {t:"Matthews and Alleyne [2003] (CA)", k:"case", d:"Approved the Woollin direction. Stressed it is a rule of evidence, not substantive law."}
    ]},
    {t:"Recklessness", d:"Foreseeing a consequence as possible or probable but going ahead and taking the risk. Pattern: subjective, then objective, then subjective again (S-O-S).", c:[
      {t:"Two limbs (subjective)", k:"key", d:"1. Did D foresee the possibility of the consequence? 2. Was it unreasonable or unjustifiable to take the risk, judged on the circumstances known to D?"},
      {t:"Cunningham (1957)", k:"case", d:"D broke a gas meter and cracked a gas pipe, and gas seeped into the house next door. ‘Maliciously’ (s.23 OAPA 1861) means intentionally or recklessly. D must have foreseen the harm might occur and gone on. Subjective."},
      {t:"Stephenson (1979)", k:"case", d:"D with schizophrenia lit a fire in a haystack to keep warm. Trial judge’s objective test was a misdirection. The question is whether D himself foresaw the risk."},
      {t:"Caldwell and Lawrence (1982)", k:"case", d:"Objective detour. Reckless if D does an act creating an obvious risk and either gave no thought to it, or recognised some risk and went on. Applied to criminal damage and reckless driving.", c:[
        {t:"Why it was criticised", d:"Punished absence of thought. Unfair to children and those with limited capacity. Created a lacuna and uncertainty about ‘obvious to whom’. Meant ‘reckless’ had two meanings."},
        {t:"Elliott v C [1983]", k:"case", d:"14-year-old girl of limited intelligence, tired and without sleep, set fire to a shed. Convicted under Caldwell though the risk was not obvious to her."},
        {t:"Shimmen (1986)", k:"case", d:"Used to show how arbitrary the Caldwell line was between thinking about a risk and not thinking."},
        {t:"Reid [1992]", k:"case", d:"Speeches disagreed on whether the risk had to be obvious to a reasonable person, to D, or both."}
      ]},
      {t:"R v G [2003] UKHL 50", k:"case", d:"Boys aged 11 and 12 set fire to bins and the fire spread to a shop. HL overruled Caldwell. D is reckless only if he knowingly disregards an appreciated, unjustifiable risk. Now the general subjective test."},
      {t:"Brady (2006)", k:"case", d:"D need only foresee ‘a’ risk of harm, not an obvious and significant risk."},
      {t:"Savage; Parmenter [1992]", k:"case", d:"Applied Cunningham to OAPA offences. s.20 needs foresight of some physical harm to some person, not serious harm. s.47 needs no MR as to the ABH beyond that for the assault or battery."}
    ]},
    {t:"Negligence", d:"Objective: D falls below the standard of a reasonable person, whatever D was thinking. Rarely enough for serious common law crimes. Mostly statutory.", c:[
      {t:"Two ways to be negligent", d:"Failing to foresee a risk a reasonable person would see, or foreseeing it and taking no or inadequate steps."},
      {t:"s.3 RTA 1988", k:"stat", d:"Careless or inconsiderate driving."},
      {t:"ss.1–2 RTA 1988", k:"stat", d:"Causing death by dangerous driving. Dangerous driving falls far below what a competent and careful driver would do."},
      {t:"s.5 DVCVA 2004", k:"stat", d:"Allowing the death of a child or vulnerable adult."}
    ]},
    {t:"Reform", c:[
      {t:"Law Com No 304 (2006)", k:"stat", d:"Proposed that: (1) a person intends a result if he acts in order to bring it about; (2) where the judge thinks justice needs it, the jury may find intention if D thought the result was a virtually certain consequence. It adopts Woollin and keeps it as evidence, with little substantive change. It would not capture Hyam-type cases."}
    ]},
    {t:"Related MR points", c:[
      {t:"Booth v CPS [2006]", k:"case", d:"Voluntary intoxication is no defence to a basic intent offence such as criminal damage. It does not negate recklessness."},
      {t:"DPP v Morgan [1976]", k:"case", d:"An honest but mistaken belief in consent need not be reasonable to negate MR for rape. Subjective approach to mistake."},
      {t:"B v DPP [2000]", k:"case", d:"Honest belief, even if unreasonable, can be a defence where the offence needs a mental element about circumstances. Prosecution must disprove the belief. Presumption that MR is required."},
      {t:"Sweet v Parsley [1970]", k:"case", d:"Source of the presumption that mens rea is required unless Parliament clearly says otherwise."}
    ]}
  ]}
}

{t:"ar", q:"Sam has no connection to a stranger who is drowning in shallow water. Sam could easily rescue them but walks on and the stranger dies. Sam is:", o:["Guilty of murder","Guilty of manslaughter","Not liable, as there is no general duty of easy rescue","Liable under the Miller principle"], a:2, e:"Under the common law there is no duty of easy rescue. A duty needs statute, contract, assumption of responsibility, official position or creation of danger."},
{t:"ar", q:"In Airedale NHS Trust v Bland, the House of Lords held that:", o:["Doctors who withdrew feeding were guilty of murder","Withdrawing life-sustaining treatment no longer in the patient’s best interests was a lawful omission","Doctors have a statutory duty to prolong life","Euthanasia is lawful in England and Wales"], a:1, e:"Bland treated withdrawal as an omission. There was no duty to continue treatment that was not in the patient’s best interests."},
{t:"ar", q:"In White (1910), D put poison in his mother’s drink to kill her, but she died of heart failure before drinking it. D was not guilty of murder because:", o:["The poison was not an operating cause","But for D’s act she would still have died when she did, so factual causation failed","The thin skull rule applied","Her heart condition was a novus actus"], a:1, e:"The but-for test was not satisfied. D could still be convicted of attempted murder."},
{t:"ar", q:"For legal causation, D’s conduct must be:", o:["The sole cause of the result","An operating and substantial cause, though not necessarily the only one","Any cause, however slight","The cause that D intended"], a:1, e:"Pagett and Smith: operating and substantial. It does not have to be the only cause."},
{t:"ar", q:"D stabs V, a Jehovah’s Witness, who refuses a blood transfusion on religious grounds and dies. According to Blaue:", o:["V’s refusal breaks the chain of causation","D remains liable because he must take his victim as he finds him, including beliefs","D is liable only for the stabbing","D is not liable because V acted voluntarily"], a:1, e:"Blaue extended the thin skull rule to the victim’s religious beliefs. The refusal did not break the chain."},
{t:"ar", q:"D prepares a syringe of heroin and hands it to V, who injects himself and dies (Kennedy (No 2)). D is:", o:["Liable for manslaughter, as but-for causation is met","Not liable for manslaughter, as V’s free, voluntary, informed act broke the chain","Liable because V had a thin skull","Liable for omission"], a:1, e:"A fully voluntary and informed act by the victim is a novus actus. This is the leading modern case."},
{t:"ar", q:"Negligent medical treatment will break the chain of causation:", o:["Whenever the doctor is negligent","Never","Only in exceptional cases where the treatment is so independent and potent (palpably wrong) that D’s injury is merely background","Only if the doctor intended to cause death"], a:2, e:"Jordan is the exceptional case. Cheshire and Smith show D normally remains liable even where treatment is negligent."},
{t:"ar", q:"V jumps from a moving car to escape D’s threats and is injured. D’s liability continues if V’s reaction was:", o:["Foreseeable and a reasonable reaction within the range to be expected","Intended by D","Voluntary","Unforeseeable but sensible"], a:0, e:"Roberts and Williams and Davies: the escape must be reasonably foreseeable and proportionate to the threat."},
{t:"ar", q:"Under s.5 Domestic Violence, Crime and Victims Act 2004, a duty is imposed on:", o:["Any bystander","Members of the same household with frequent contact, to protect a child or vulnerable adult from foreseeable death or serious harm","Doctors only","Parents only"], a:1, e:"This is the statutory duty route to liability for omissions."},
{t:"ar", q:"Which intervening event is most likely to break the chain of causation?", o:["V’s reasonable panicked escape","A lightning strike on V while she lies injured","V’s failure to look after her wounds","Slightly negligent hospital treatment"], a:1, e:"An unforeseeable natural event (‘act of God’) breaks the chain. The others typically do not (Roberts, Dear, Cheshire)."},
{t:"ar", q:"Which case is the usual authority that self-neglect by the victim does not break the chain?", o:["Dear (1996)","Jordan (1956)","Pittwood (1902)","White (1910)"], a:0, e:"Dear (and Holland) deal with self-neglect. Blaue is the transfusion case. Your seminar answer on the transfusion question cites Dear, but Blaue is the transfusion case."},

// ---------- MENS REA ----------
{t:"mr", q:"The mens rea for murder is:", o:["Intention to kill only","Intention to kill or cause grievous bodily harm","Recklessness as to death","Negligence as to death"], a:1, e:"Malice aforethought: intention to kill or cause GBH (Vickers; Cunningham [1982]). Recklessness is not enough."},
{t:"mr", q:"Direct intention is best described as:", o:["Foresight of a virtual certainty","D’s aim or purpose","Foresight of a probable result","Taking an unreasonable risk"], a:1, e:"Direct intent is where the consequence is D’s aim or purpose (Mohan)."},
{t:"mr", q:"Under the Woollin direction a jury may find oblique intention if they are sure that:", o:["Death or serious harm was a substantial risk and D realised it","Death or serious harm was a virtual certainty and D appreciated this","Death was highly probable","Death was a natural consequence of D’s act"], a:1, e:"Virtual certainty plus appreciation (VC + A). ‘Substantial risk’ was held to be a misdirection."},
{t:"mr", q:"Which case held that a direction allowing intention to be found where D saw a ‘substantial risk’ of serious harm was a misdirection?", o:["Hyam v DPP","Nedrick","Woollin","Moloney"], a:2, e:"Lord Steyn in Woollin: ‘substantial risk’ blurred the line between intention and recklessness, so between murder and manslaughter."},
{t:"mr", q:"Parliament reversed the irrebuttable objective presumption in DPP v Smith by:", o:["s.8 Criminal Justice Act 1967","s.1 Criminal Damage Act 1971","s.5 DVCVA 2004","s.20 OAPA 1861"], a:0, e:"s.8 CJA 1967: the court is not bound to infer intent or foresight from natural and probable consequences and must look at all the evidence."},
{t:"mr", q:"In Hyam v DPP the House of Lords held D could have the mens rea for murder if she foresaw death or GBH as:", o:["Virtually certain","Highly probable","Merely possible","A natural consequence"], a:1, e:"Hyam’s ‘highly probable’ test was too close to recklessness and was abandoned in favour of virtual certainty."},
{t:"mr", q:"Matthews and Alleyne confirmed that the Woollin direction is:", o:["A substantive definition of intention","A rule of evidence from which the jury may find intention","Limited to GBH cases","Only for oblique intent in manslaughter"], a:1, e:"Foresight of virtual certainty is evidence. The jury may, but need not, find intention."},
{t:"mr", q:"In Cunningham (1957) ‘maliciously’ in the OAPA 1861 was held to mean:", o:["Wickedly","Intentionally or recklessly","Negligently","With premeditation"], a:1, e:"D must have foreseen that harm might occur and gone on to take the risk. This is subjective recklessness."},
{t:"mr", q:"Under the Caldwell test, D was reckless if:", o:["He actually foresaw the risk and went on","He did an act creating an obvious risk and either gave it no thought or recognised some risk and went on","He intended the damage","He was negligent about the damage"], a:1, e:"Caldwell’s objective limb punished D who gave no thought to an obvious risk. It was overruled by R v G."},
{t:"mr", q:"After R v G [2003], D is reckless only if:", o:["The risk would have been obvious to a reasonable person","D was aware of a risk and it was unreasonable in the circumstances to take it","D foresaw the result as virtually certain","D intended some harm"], a:1, e:"R v G restored the subjective Cunningham test. Awareness of the risk is essential."},
{t:"mr", q:"According to Brady (2006), the prosecution must prove D foresaw:", o:["An obvious and significant risk of harm","A virtual certainty of harm","A risk of harm, not necessarily an obvious or significant one","Serious harm"], a:2, e:"D need only foresee ‘a’ risk."},
{t:"mr", q:"For s.20 OAPA 1861, Savage and Parmenter requires D to have foreseen:", o:["Grievous bodily harm","Some physical harm to some person","Death","No mental element is needed"], a:1, e:"Cunningham-style malice: foresight of some harm, not serious harm."},
{t:"mr", q:"Which statement about negligence is correct?", o:["It is a subjective test","It is an objective test: D falls below the standard of a reasonable person","It is the mens rea for murder","It is the same as recklessness"], a:1, e:"Negligence is judged against a reasonable person whatever D was thinking, and it is rarely enough at common law."},
{t:"mr", q:"The House of Lords said in Hancock and Shankland that Lord Bridge’s Moloney guidelines were misleading because:", o:["They stated the test was subjective","They did not explain that the greater the probability of a result, the more likely it was foreseen","They required virtual certainty","They ignored s.8 CJA 1967"], a:1, e:"Lord Scarman: ‘natural’ is not the same as ‘probable’. Juries need to be told about probability."},
{t:"mr", q:"Ali sets fire to his own shop for the insurance, knowing a tenant sleeps upstairs. He thinks the tenant will probably escape and does not want her to die. She dies. Does Ali have oblique intent for murder?", o:["Yes, foresight of probable death is enough (Hyam)","Only if the jury is sure he saw death or serious harm as virtually certain and appreciated this","Yes, because arson is a dangerous act","No, because he had a motive"], a:1, e:"Woollin. ‘Probable’ does not meet the virtual certainty test. Ali would more likely face manslaughter."},
{t:"mr", q:"Rex lights a bonfire next to a fence and genuinely never realises sparks could spread. A reasonable person would have seen the risk. The fence is damaged. Is Rex reckless as to the damage?", o:["Yes, the risk was obvious (Caldwell)","No, as under R v G he must have been aware of the risk","Yes, because he is negligent","Yes, because he intended the fire"], a:1, e:"After R v G the test is subjective. Inadvertence is not recklessness, though it might be negligence."},
{t:"mr", q:"Booth v CPS is authority that voluntary intoxication:", o:["Negates recklessness for criminal damage","Is no defence to a basic intent offence such as criminal damage","Is a defence to all offences","Only affects sentence"], a:1, e:"The intoxicated defendant could still be convicted of criminal damage."},
{t:"mr", q:"Cunningham [1982] AC 566 is authority that:", o:["‘Maliciously’ means reckless","Intention to cause GBH is sufficient mens rea for murder","The Woollin direction is a rule of evidence","Caldwell recklessness is no longer law"], a:1, e:"Do not mix up the two Cunninghams. 1957 is recklessness under the OAPA. 1982 is murder."},
{t:"mr", q:"Which case is the starting point for the presumption that mens rea is required unless Parliament clearly says otherwise?", o:["Sweet v Parsley","DPP v Smith","Matthews and Alleyne","Mohan"], a:0, e:"Sweet v Parsley. B v DPP confirms it."}
];

  facts:"Dan argues with Eve in the street. Furious, he slaps her hard across the face and she falls and hits her head. Unknown to Dan, Eve has a rare clotting disorder and begins to bleed internally. A paramedic takes her to hospital, where a doctor negligently gives her a drug that worsens the bleeding. Eve dies. Advise on Dan’s liability for Eve’s death.",

// Plain-English explainers. s: short rule. say: everyday explanation. ex: example. m: memory hook.
const PLAIN = [
{t:"ar", h:"Actus reus and mens rea together", s:"A crime is the guilty act, plus the guilty mind, minus any defence.", say:"The actus reus is what D did, caused or failed to do. The mens rea is what D was thinking. You usually need both, at the same moment, and no defence such as self-defence.", ex:"Picking up someone else’s umbrella by mistake is the physical act of taking, but with no dishonest mind it is not theft.", m:"Act + Mind – Defence"},
{t:"ar", h:"Three types of crime", s:"Conduct, result, or state of affairs.", say:"Conduct crimes are complete when you do the thing. Result crimes need a harmful outcome that you caused. State of affairs crimes punish being in a situation, such as carrying a weapon or being drunk in charge of a car.", ex:"Murder is a result crime, because someone has to die. Possessing an offensive weapon is a state of affairs, because carrying it is the offence.", m:"Do it / Cause it / Be in it"},
{t:"ar", h:"Omissions: when is doing nothing a crime?", s:"Only when you owed a legal duty to act.", say:"The law does not make you rescue strangers. It does make you act if a duty exists. Duties come from five places, and the SPACE list is a quick way to remember them.", ex:"A lifeguard watching someone drown breaches a contractual duty. A passer-by watching the same thing breaches nothing.", m:"SPACE: Statute, Public position, Assumption of care, Contract, Engineered danger"},
{t:"ar", h:"Causation in three steps", s:"But for, then big enough, then unbroken.", say:"First, would the result have happened without D’s act (factual)? Second, was D’s act an operating and substantial cause (legal)? Third, did something new and independent step in to break the chain (novus actus)?", ex:"D stabs V. V is taken to hospital and a nurse makes a minor error. D’s stabbing is still the operating cause, so the chain is intact.", m:"F, L, N"},
{t:"ar", h:"Thin skull rule", s:"You take your victim as you find them.", say:"If the victim is unusually fragile, physically or because of their beliefs, D is liable for the full result. D does not get a discount because the victim was vulnerable.", ex:"A light punch kills someone with a rare condition. D is still the cause of death. In Blaue, the victim’s religious refusal of treatment did not help the defendant.", m:"Blaue: stab + beliefs"},
{t:"ar", h:"When the chain breaks", s:"Free, voluntary and informed acts, or unforeseeable events.", say:"Think of a row of dominoes. The chain breaks when someone deliberately moves one or something unforeseeable knocks it. Foreseeable reactions do not break it: panic, escape attempts, ordinary medical errors, a victim’s carelessness.", ex:"Handing someone heroin and watching them inject themselves breaks the chain (Kennedy). A victim jumping from a car in fear does not (Roberts).", m:"Voluntary, informed, unforeseeable = break"},

{t:"mr", h:"Levels of fault", s:"Intention, then recklessness, then negligence.", say:"Intention is meaning it. Recklessness is knowing there is a risk and going ahead. Negligence is falling below what a sensible person would do, whether or not you noticed.", ex:"Throwing a stone at a window to smash it is intention. Throwing a stone near it knowing it might hit is recklessness. Not noticing the window was there is negligence.", m:"Meant it / Knew the risk / Should have known"},
{t:"mr", h:"Direct v oblique intent", s:"Aim, or virtually certain side-effect you knew about.", say:"Direct intent is your goal. Oblique intent is a side-effect you did not want but knew was virtually certain. The jury may then find that you intended it. Be careful: high probability is not enough.", ex:"You blow up a plane to claim insurance and know the crew will almost certainly die. You do not want them dead, but a jury may find you intended it.", m:"Woollin: VC + A (virtual certainty and appreciation)"},
{t:"mr", h:"Why the oblique intent cases keep changing", s:"Courts moved from what a reasonable person would foresee to what D foresaw, and from probable to virtually certain.", say:"Smith (1961) said you intend what a reasonable person would expect. Parliament overruled that in s.8. Hyam allowed ‘highly probable’, which was too wide. Moloney and Hancock pulled this back. Nedrick set virtual certainty and Woollin confirmed it.", ex:"Hyam (letterbox fire) would likely be decided differently now.", m:"Smith, Hyam, Moloney, Hancock, Nedrick, Woollin"},
{t:"mr", h:"Subjective v objective", s:"Subjective: what D thought. Objective: what a reasonable person would think.", say:"Intention and recklessness (since R v G) are subjective. D’s own state of mind matters. Negligence is objective. This is why a young child who never saw the risk is not reckless.", ex:"An 11-year-old who never realised a fire could spread is not reckless (R v G). Under Caldwell he would have been.", m:"Subjective: my head. Objective: their head."},
{t:"mr", h:"Recklessness in one line", s:"Spotted a risk, took it, and it was unreasonable.", say:"Two limbs. D saw that harm might happen, and it was unreasonable to take the risk in the circumstances D knew about. Not noticing the risk is not recklessness.", ex:"Skating on ice you know is cracking is reckless. Skating without noticing the cracks is not (though it may be negligent).", m:"G = Gave it thought"},
{t:"mr", h:"Caldwell and R v G", s:"Caldwell punished not thinking. G restored the need to actually foresee.", say:"Under Caldwell, if a risk was obvious and D did not think about it, D was reckless. That was unjust to children and others who could not see it. R v G (2003) overruled it.", ex:"Elliott v C (tired girl, shed) would now come out differently.", m:"Subjective, objective, subjective (S-O-S)"},
{t:"mr", h:"Two Cunninghams", s:"1957 = recklessness. 1982 = murder.", say:"Both come up in notes and exams. Cunningham (1957) is the gas meter case on ‘maliciously’. Cunningham [1982] confirms that intending GBH is enough for murder.", ex:"If you cite the wrong year, the examiner will assume the wrong rule.", m:"57 = risk, 82 = murder"}
];

    {h:"1. Murder", p:["Killing Tom with a bottle blow to the head. Intent to cause GBH can be inferred (Vickers). Drunkenness does not remove intent here.","So murder, unless a partial defence applies."]},
    {h:"2. Loss of control", p:["Say what the defence is: CJA 2009 ss 54–55, an evidential burden on Sam, with the prosecution disproving it if the judge finds sufficient evidence.","Loss of self-control: subjective and need not be sudden. The immediacy helps Sam."]},
    {h:"3. Qualifying trigger", p:["No fear of serious violence (s 55(3)).","Things said or done (s 55(4)): the sexual infidelity is disregarded (s 55(6)(c)). Clinton: it cannot be cut out entirely where it is part of the context of a genuine trigger. Ella’s taunt, ‘useless coward’, is hurtful but is unlikely to be of an ‘extremely grave character’ causing a justifiable sense of being seriously wronged (Dawes sets a high bar).","Compare Clinton: there the taunts were more extreme and the facts included years of tension."]},
    {h:"4. Objective test: gravity v control", p:["Gravity characteristics count. Control characteristics are excluded (s 54(3)).","Sam’s short temper, drunkenness and anxiety disorder go to his capacity for self-restraint, so they are excluded (Holley; Rejmanski; Asmelash). Intoxication is disregarded in particular.","A person of Sam’s sex and age with normal tolerance is unlikely to kill with a bottle in this situation."]},
    {h:"5. Diminished responsibility", p:["His anxiety disorder might count as a recognised medical condition. Did it substantially impair his rational judgment or self-control and explain the killing? He must prove this.","Drink: Dowds and Dietschmann. Drink alone is not enough, and if a genuine condition and drink coexist, the jury disregards the drink."]},
    {h:"6. Conclude", p:["Loss of control probably fails on the trigger and the objective test. Diminished responsibility depends on medical evidence about the anxiety disorder. Murder is the likely outcome without it."]}
  ]
},
{
  id:"pq7", t:"mm", title:"Switching off the machine", tags:["Murder AR","Life support","Causation","Diminished responsibility"],
  facts:"Dan, who has been diagnosed with severe depression, stabs Ed in the stomach during an argument. Ed is taken to hospital, develops brain damage and is placed on a life-support machine. After tests, doctors conclude there is no prospect of recovery and, with the family’s agreement, switch off the machine. Ed dies. Dan says the doctors killed Ed. Discuss Dan’s liability for murder.",
  task:"Work through the actus reus first, then the mens rea, then the partial defence.",
  steps:[
    {h:"1. Define murder", p:["Unlawfully killing a reasonable creature in being under the King’s peace with intent to kill or cause GBH (Coke)."]},
    {h:"2. Actus reus: causation", p:["Factual cause: but for the stabbing, Ed would not have been on the machine (White; Pagett).","Legal cause: more than minimal (Cato) or operating and substantial (Smith). The stabbing remains an operating cause.","Novus actus: Dan relies on the doctors. A patient on life support is still alive (Malcherek; Steel), and switching off after proper tests is a lawful omission (Bland). It does not break the chain."]},
    {h:"3. Mens rea", p:["Intent to kill or cause GBH. A stab to the stomach allows the inference of intent to cause GBH (Vickers). Recklessness is not enough, so if Dan did not mean serious harm, the offence is manslaughter instead.","Mention oblique intent (Woollin) only if the facts suggest his aim was something other than injuring Ed."]},
    {h:"4. Diminished responsibility", p:["If the elements of murder are made out, consider whether Dan’s depression is an abnormality of mental functioning from a recognised medical condition that substantially impaired his rational judgment or self-control and explains the killing.","He must prove this on the balance of probabilities, with medical evidence. If successful, the verdict is manslaughter."]},
    {h:"5. Conclude", p:["Dan is likely the legal cause of death. Murder follows if intent to cause GBH is proved. Diminished responsibility is his main route to manslaughter. Mention that loss of control looks unlikely on these facts as no trigger is described."]}
  ]
}
);

// ---- Plain English ----
PLAIN.push(
{t:"mm", h:"The homicide family", s:"One actus reus, different minds and defences.", say:"Every unlawful killing starts with the same physical element: D causes a person’s death. What separates murder from manslaughter is what D was thinking and whether a partial defence applies.", ex:"Killing with intent to cause GBH is murder. A killing in a genuine loss of control, if the defence succeeds, becomes manslaughter.", m:"Same act, different mind"},
{t:"mm", h:"Murder in one line", s:"Unlawfully killing a living person, meaning to kill or seriously injure.", say:"Intent to kill or cause really serious harm is enough. Carelessness and even recklessness as to death are not. The sentence is mandatory life, which is why the partial defences matter.", ex:"Hitting someone hard on the head with a bottle allows a jury to infer intent to cause GBH.", m:"Vickers: GBH is enough"},
{t:"mm", h:"Is the victim ‘alive’ in law?", s:"A person on life support is still alive.", say:"A baby counts once fully born and independent. A patient on a ventilator is alive, so if D’s attack leaves V on a machine and doctors lawfully turn it off, D is still the cause of death.", ex:"D stabs V. Doctors switch off the machine after proper tests. D cannot say the doctors killed V.", m:"Malcherek, Steel, Bland"},
{t:"mm", h:"Partial defences ladder", s:"Murder drops to manslaughter if a partial defence works.", say:"There are three: loss of control, diminished responsibility, and suicide pact. They only work for murder. The judge then has full discretion on sentence instead of mandatory life.", ex:"Proving diminished responsibility turns a murder conviction into manslaughter.", m:"LOC, DR, suicide pact"},
{t:"mm", h:"Who has to prove it?", s:"Loss of control: prosecution disproves. DR and suicide pact: D proves.", say:"For loss of control, D only needs to raise evidence and the prosecution must then disprove it beyond reasonable doubt. For diminished responsibility and suicide pact, D must prove it on the balance of probabilities.", ex:"A defendant claiming DR will usually need psychiatric evidence.", m:"LOC: they disprove. DR: you prove."},
{t:"mm", h:"Diminished responsibility", s:"A recognised medical condition that substantially impaired D and explains the killing.", say:"Not just being drunk or angry. The condition must be recognised, must substantially impair rational judgment or self-control, and must help explain the killing. Drink alone does not count, but drink alongside a real condition does not stop it.", ex:"Depression with heavy drinking: the jury sets the drink aside and asks if the depression substantially impaired D (Dietschmann).", m:"Dowds: drink alone fails"},
{t:"mm", h:"Loss of control in three steps", s:"Snapped, qualifying trigger, ordinary-person test.", say:"D must really have lost self-control. There must be a qualifying trigger: fear of serious violence, or things said or done that were extremely grave. And an ordinary person of D’s age and sex, with normal tolerance, might have done the same. Planned revenge does not count.", ex:"A victim of abuse who kills when threatened with serious violence against her child may qualify. A person who plans a killing because of an insult does not.", m:"S-T-O: Snap, Trigger, Ordinary person"},
{t:"mm", h:"Gravity v control", s:"Traits that make the insult worse count. Traits that make D less patient do not.", say:"A taunt about D’s impotence is more hurtful because of his condition, so that counts as gravity. A short temper or being drunk only means D has less self-control, so it is excluded. Only age and sex can adjust the standard.", ex:"Mocking an addict about his addiction is a gravity point. The addict’s lower tolerance is not.", m:"Gravity in, control out"},
{t:"mm", h:"Sexual infidelity", s:"Not a trigger by itself. Can be part of the story (Clinton).", say:"Parliament said cheating is disregarded as a trigger. Clinton held it cannot be cut out entirely where it is part of a bigger context that does amount to a trigger, such as taunts that would otherwise qualify.", ex:"Finding a partner with someone else alone is not enough. Cruel taunts and other grave behaviour alongside it may be assessed together.", m:"Infidelity: context, not trigger"},
{t:"mm", h:"Provocation to loss of control", s:"The new law is clearer and stricter.", say:"Provocation needed a sudden and temporary loss of control and a reasonable man test that moved from Camplin to Smith to Holley. Loss of control drops suddenness, adds specific triggers, excludes infidelity and revenge, and settles the characteristics question.", ex:"A slow-burn killing by an abused partner is easier to argue than before, but a cold plan is excluded.", m:"Duffy to s 54"}
);

// Topic: Diminished responsibility and involuntary manslaughter (t:"im").
MAPS.im = {
  title: "DR & involuntary manslaughter",
  root: {t:"Diminished responsibility and involuntary manslaughter", d:"Diminished responsibility is a partial defence to murder (voluntary manslaughter). Involuntary manslaughter is where D lacks the murder mens rea but is still blameworthy: unlawful act manslaughter, gross negligence manslaughter, subjectively reckless manslaughter, plus statutory corporate manslaughter.", c:[
    {t:"Diminished responsibility: basics", d:"A partial defence to murder only. If it succeeds, murder becomes manslaughter (s 2(3)), so the judge has sentencing flexibility instead of mandatory life.", c:[
      {t:"HA 1957 s 2(1)", k:"stat", d:"Introduced the defence. Amended from 4 October 2010 by CJA 2009 s 52."},
      {t:"Burden on D", d:"The legal burden is on the defence. D must prove every element on the balance of probabilities (s 2(2)).", c:[
        {t:"Dunbar (1958)", k:"case", d:"Authority that D bears the burden of proving diminished responsibility."}
      ]}
    ]},
    {t:"DR: the four elements", k:"key", d:"D must prove: (1) an abnormality of mental functioning; (2) arising from a recognised medical condition (s 2(1)(a)); (3) substantially impairing D’s ability to understand the nature of conduct, form a rational judgment or exercise self-control (s 2(1)(b), s 2(1A)); (4) providing an explanation for the conduct (s 2(1)(c)), meaning it caused or was a significant contributory factor (s 2(1B)).", c:[
      {t:"1. Abnormality of mental functioning", d:"Formerly ‘abnormality of mind’. Covers perception, rational judgment and willpower.", c:[
        {t:"Byrne [1960]", k:"case", d:"Lord Parker CJ: a state of mind so different from ordinary human beings that the reasonable man would call it abnormal. Includes inability to exercise willpower to control acts."},
        {t:"Seers (1984)", k:"case", d:"Avoid ‘partial insanity’ or ‘borderline insanity’. Insanity is a separate defence and the labels confuse juries."},
        {t:"Dix (1981)", k:"case", d:"Medical evidence is needed to support the claim."}
      ]},
      {t:"2. Recognised medical condition", d:"Post-2010 the condition must be a recognised medical condition. This ties the defence to recognised diagnoses and makes expert evidence more important.", c:[
        {t:"Pre-2010 sources", d:"Arrested or retarded development of mind, inherent causes, or disease or injury. These were read widely."},
        {t:"Hobson (1998)", k:"case", d:"Battered woman’s syndrome can ground the defence."},
        {t:"Ahluwalia (1993)", k:"case", d:"Depression and battered woman’s syndrome could amount to diminished responsibility. New trial ordered."},
        {t:"Smith (1982)", k:"case", d:"Pre-menstrual syndrome accepted as an abnormality."},
        {t:"Vinagre (1979)", k:"case", d:"Morbid jealousy accepted as an abnormality."},
        {t:"Sanderson (1994)", k:"case", d:"Paranoid psychosis and functional mental illness qualify."}
      ]},
      {t:"3. Substantial impairment", d:"A jury question. More than trivial, but need not be total.", c:[
        {t:"Lloyd (1967)", k:"case", d:"Substantial impairment is a jury question and means more than trivial."},
        {t:"Simcox (1964)", k:"case", d:"Approved direction: look at it broadly, as a common-sense person would."},
        {t:"Golds [2014] CA; [2016] UKSC 61", k:"case", d:"The Court of Appeal criticised the Bench Book direction. The Supreme Court held ‘substantial’ means less than total but more than merely trivial. Judges should not normally elaborate unless the jury asks."}
      ]},
      {t:"4. Explains the conduct", d:"The abnormality caused, or was a significant contributory factor in causing, D to carry out the conduct (s 2(1B))."}
    ]},
    {t:"DR and intoxication", d:"Being drunk does not help. Alcohol dependency can, if drinking was involuntary. With a genuine condition plus drink, the jury disregards the drink and asks if the abnormality alone substantially impaired D.", c:[
      {t:"Fenton (1975)", k:"case", d:"Ordinary self-induced intoxication cannot found the defence."},
      {t:"Tandy (1989)", k:"case", d:"Alcohol dependency syndrome can be an abnormality where cravings make drinking involuntary. Her defence failed because the first drink of the day was voluntary."},
      {t:"Wood (2008)", k:"case", d:"Alcohol dependency syndrome can qualify even without brain damage."},
      {t:"Stewart (2009)", k:"case", d:"Whether ADS qualifies depends on the nature and extent of the dependency, and the jury decides."},
      {t:"Gittens (1984)", k:"case", d:"If D is mentally abnormal and drunk, the jury disregards the drink and asks whether the abnormality alone substantially impaired D."},
      {t:"Dietschmann [2003] HL", k:"case", d:"The abnormality need not be the sole cause. The question is whether, despite the drink, it substantially impaired D."}
    ]},
    {t:"Involuntary manslaughter: overview", d:"D unlawfully causes death without intent to kill or cause GBH, so lacks the mens rea for murder. Three types, plus corporate manslaughter as a statutory offence. Sentence is discretionary.", c:[
      {t:"1. Unlawful act (constructive)", d:"See the UAM branch."},
      {t:"2. Gross negligence", d:"See the GNM branch."},
      {t:"3. Subjectively reckless", d:"See Lidar."},
      {t:"Murder v voluntary v involuntary", d:"Murder: intent to kill or cause GBH. Voluntary manslaughter: same mens rea but a partial defence applies (DR, loss of control, suicide pact). Involuntary manslaughter: the murder mens rea is simply absent."}
    ]},
    {t:"Unlawful act manslaughter (UAM)", d:"Larkin (1944), Humphreys J: D does an unlawful act which is also dangerous, that is likely to injure another, and inadvertently causes that person’s death. The prosecution need not prove D intended or foresaw death or knew the act was unlawful or dangerous.", c:[
      {t:"Newbury and Jones: four ingredients", k:"key", d:"Lord Salmon: (1) D intentionally does an act; (2) the act is unlawful; (3) the act is dangerous; (4) the act causes death. Dangerousness is objective. The only subjective elements are that the act was intentional and that the base offence’s mens rea is proved."},
      {t:"(i) Intentional act", d:"The intention relates to the act, not the death. It must be a positive act.", c:[
        {t:"Lowe", k:"case", d:"A negligent omission is not enough. UAM needs a positive act. Your notes date it 1976."}
      ]},
      {t:"(ii) Unlawful act", d:"A criminal offence, with both actus reus and mens rea of it proved.", c:[
        {t:"Lamb (1967)", k:"case", d:"D pointed a semi-loaded revolver at V as a joke. Neither thought it would fire, but the chamber rotated and it did. No UAM because the assault lacked mens rea: V did not apprehend violence."}
      ]},
      {t:"(iii) Dangerous act", d:"Sober and reasonable people would recognise a risk of some harm, though not serious harm. The reasonable person has the knowledge D had at the time.", c:[
        {t:"Church [1965]", k:"case", d:"D hit V after she mocked him, knocked her out, thought she was dead and threw her in a river, where she drowned. Test: all sober and reasonable people would inevitably recognise at least a risk of some harm, albeit not serious harm."},
        {t:"Dawson (1985)", k:"case", d:"Armed robbery of a petrol station. The attendant had a heart condition and died. Conviction quashed because a reasonable bystander would not have known of it. Harm means physical harm, not just fright."},
        {t:"Watson [1989]", k:"case", d:"Burglar threw a brick through an 87-year-old’s window and abused him. V had a serious heart condition and died about 90 minutes later. The reasonable person shares knowledge D gained during the act, and D could see V was frail. Conviction quashed on causation."}
      ]},
      {t:"(iv) Causation", d:"Normal causation rules apply. The act need not be aimed at V. The thin skull rule applies to causation but does not widen what counts as dangerous.", c:[
        {t:"Goodfellow (1986)", k:"case", d:"D set fire to his council house to get rehoused, hoping his family would escape. His wife, girlfriend and a child died. Manslaughter, even though the act was not directed at them."}
      ]}
    ]},
    {t:"The drugs cases", d:"Whether the supply or administration of heroin leads to UAM depends on who did the injecting.", c:[
      {t:"D injects V", d:"The unlawful act can be administering a noxious thing so as to endanger life or inflict GBH (OAPA 1861 s 23). Consent is no defence.", c:[
        {t:"Cato [1976]", k:"case", d:"D and V injected each other with heroin. The unlawful act was injecting the deceased with a mixture of heroin and water. Consent was no defence."}
      ]},
      {t:"D supplies, V self-injects", d:"Not UAM. V’s free, voluntary and informed act breaks the chain of causation.", c:[
        {t:"Earlier cases", k:"case", d:"Dalby (1982), Dias (2001), Rogers (2003) and Finlay (2009) struggled with causation."},
        {t:"Kennedy (No 2) [2007] UKHL 38", k:"case", d:"D prepared a syringe of heroin and handed it to V, who injected himself and died an hour later. Not guilty of UAM. Lord Bingham: informed adults of sound mind are autonomous."}
      ]},
      {t:"Joint administration", d:"Obiter, Lord Bingham said that if D and V acted together to administer the drug, D could be guilty of UAM.", c:[
        {t:"Rogers (2003)", k:"case", d:"D held a tourniquet while V injected. Treated as taking part in the administration."}
      ]}
    ]},
    {t:"Gross negligence manslaughter (GNM)", d:"Adomako [1995] 1 AC 171 (HL): an anaesthetist failed to notice a disconnected ventilator tube and the patient died.", c:[
      {t:"Adomako: four elements", k:"key", d:"(1) D owed V a duty of care. (2) D breached it. (3) The breach caused V’s death. (4) The breach was grossly negligent: so bad that the jury considers it criminal (Lord Mackay)."},
      {t:"Finding a duty", d:"By ordinary negligence principles: established categories (doctor/patient, employer/employee, occupier/visitor), or the Caparo tests: foreseeability of harm, proximity, and whether it is fair, just and reasonable."},
      {t:"Wacker [2002]", k:"case", d:"Lorry driver smuggled 60 Chinese migrants in a sealed container and 58 suffocated. A joint illegal enterprise does not defeat the duty of care, and the sealed container made the risk of death obvious."},
      {t:"Evans [2009]", k:"case", d:"D supplied heroin to her half-sister, who self-administered and became seriously ill. D did not get help. A duty can arise where D creates or contributes to a state of affairs she knows or ought to know has become life-threatening. A supplier can be liable for GNM even though Kennedy blocks UAM."},
      {t:"Misra and Srivastava (2004); Rose (2017)", k:"case", d:"The risk must be a serious and obvious risk of death, not just of harm."}
    ]},
    {t:"Subjectively reckless manslaughter", d:"D foresees death or serious injury as highly probable but takes the risk anyway.", c:[
      {t:"Lidar (CA, 11 Nov 1999, unreported)", k:"case", d:"D drove off after a fight with V clinging to the car. V fell and was run over. The Court of Appeal accepted reckless manslaughter as a valid category. Its status is slightly uncertain because it is unreported and later cases sometimes subsume it within GNM."}
    ]},
    {t:"Corporate manslaughter", d:"A statutory offence replacing common-law GNM liability for organisations.", c:[
      {t:"CMCHA 2007 s 1", k:"stat", d:"Abolished common-law GNM liability of organisations and created a statutory offence. Aimed at senior management (s 1(4)(c)). Liability no longer depends on convicting an individual director."},
      {t:"Duty and gross breach", d:"The organisation must owe a duty of care (s 2(1)). The death must be caused by a gross breach that falls far below what is reasonably expected (s 1(4)(b))."}
    ]}
  ]}
};

// ---- Problem questions ----
PQS.push(
{
  id:"pq8", t:"im", title:"The shove at the party", tags:["UAM","Dangerousness","Dawson","Watson"],
  facts:"At a party Ria, who has been drinking, argues with Sam, an elderly guest who walks with a stick. Ria angrily shoves Sam in the chest. Sam falls, hits his head and dies. A post-mortem shows he had a rare brain condition that made the injury fatal. Ria says she never meant to hurt him. Discuss Ria’s liability for manslaughter, and say whether your answer changes if Sam had been a fit 30-year-old with the same hidden condition.",
  task:"Take the four Newbury and Jones ingredients in order. Spend longest on dangerousness.",
  steps:[
    {h:"1. Why not murder?", p:["Murder needs intent to kill or cause GBH. A shove does not suggest that. So she lacks the murder mens rea and the issue is involuntary manslaughter, probably UAM."]},
    {h:"2. State the test", p:["Larkin and Newbury and Jones: intentional act, unlawful, dangerous, causes death. D need not foresee death or know the act is unlawful or dangerous."]},
    {h:"3. Intentional and unlawful", p:["Intentional act: the shove is a positive act (Lowe).","Unlawful: battery. Prove both actus reus and mens rea: she intended or was reckless as to applying force (Lamb). Intoxication does not prevent recklessness for a basic intent offence (Booth v CPS in your mens rea notes)."]},
    {h:"4. Dangerous (the main issue)", p:["Church: would sober and reasonable people recognise a risk of some physical harm, though not serious harm?","The sober and reasonable person has the knowledge D had. Ria could see that Sam was elderly and used a stick. Watson: knowledge gained during the incident counts. A bystander would see a risk of a fall, so some harm. The act is dangerous.","She did not need to know about the hidden brain condition."]},
    {h:"5. Causation", p:["Factual: but for the shove, Sam would not have died then (White).","Legal: operating and substantial cause. Thin skull: she takes the victim as she finds him, so the hidden condition does not break the chain (Blaue).","The thin skull rule applies to causation. It does not widen what counts as dangerous (Dawson)."]},
    {h:"6. The variation: a fit 30-year-old with a hidden condition", p:["Now the shove would not be seen as risking more than minor harm. Dangerousness depends on harm a reasonable person would see: a shove could cause a stumble, some physical harm. Argue both sides.","Dawson: the hidden condition cannot be used to make the act dangerous. But a shove carries some risk of physical harm, so the prosecution can still argue dangerousness without relying on the condition. Then thin skull covers causation.","Conclude with the more likely view and say what turns on it."]}
  ]
},
{
  id:"pq9", t:"im", title:"Two friends and a supplier", tags:["Drugs cases","Kennedy (No 2)","Cato","Evans","GNM"],
  facts:"Kai buys heroin and takes it to a flat. Lee asks for a dose. Kai prepares a syringe, hands it to Lee, and Lee injects himself. Mo then asks Kai to inject him as he is afraid of needles. Kai injects Mo. Both collapse. Kai panics and leaves without calling an ambulance. Lee and Mo both die. Discuss Kai’s liability for each death.",
  task:"Treat Lee and Mo separately and always ask: who administered the drug?",
  steps:[
    {h:"1. Lee: UAM", p:["Kai supplied and prepared the syringe, but Lee injected himself.","Kennedy (No 2): V’s free, voluntary and informed act of self-injection breaks the chain of causation. Informed adults of sound mind are autonomous.","Earlier cases (Dalby, Dias, Finlay) struggled with the same causation problem. So UAM is unlikely for Lee."]},
    {h:"2. Lee: joint administration?", p:["Lord Bingham’s obiter: where D and V act together in administering the drug, D could be liable (Rogers: holding a tourniquet).","On the facts Kai only prepared and handed over the syringe. Argue that this is supply, not joint administration, unless the question says he helped with the injection."]},
    {h:"3. Mo: UAM", p:["Kai injected Mo himself. The unlawful act can be administering a noxious thing so as to endanger life or inflict GBH (OAPA 1861 s 23) (Cato).","Consent is no defence (Cato). Intentional act: injecting. Dangerous: Church, a risk of some harm. Causation: Kai’s act directly caused the overdose, no break in the chain.","Likely guilty of UAM for Mo."]},
    {h:"4. GNM as an alternative for both", p:["Adomako: duty, breach, causation, gross negligence.","Duty: Evans, a duty can arise where D creates or contributes to a life-threatening state of affairs he knows or ought to know about. Wacker: illegality does not remove the duty.","Breach: leaving without help. Causation: would calling an ambulance have saved them? The prosecution must prove it. Risk: serious and obvious risk of death (Misra; Rose).","This is the route to Lee’s death that Kennedy does not block."]},
    {h:"5. Conclude", p:["Lee: UAM unlikely (Kennedy), GNM arguable. Mo: UAM likely, GNM in the alternative. Highlight that causation of death by omission is the key factual issue."]}
  ]
},
{
  id:"pq10", t:"im", title:"The landlord and the boiler", tags:["GNM","Duty of care","Caparo","Corporate manslaughter"],
  facts:"Ed owns a flat and rents it to Nina. Nina complains three times that the gas boiler gives off fumes and makes her dizzy. Ed, who has had no gas safety check done for years, says he will look at it ‘when he has time’. Nina dies of carbon monoxide poisoning. Ed’s letting is run through a company, Ed Lets Ltd, whose directors are Ed and his brother. Discuss liability for Nina’s death.",
  task:"Use the four Adomako elements. Then consider the company.",
  steps:[
    {h:"1. Choose the offence", p:["No intent to kill or cause GBH, so not murder. No unlawful act is obvious, so UAM is weak. The natural charge is gross negligence manslaughter (Adomako)."]},
    {h:"2. Duty of care", p:["Established category: landlord and tenant, or at least by Caparo: foreseeability of harm, proximity, and fair, just and reasonable. Landlord and tenant of a gas-heated flat meets all three."]},
    {h:"3. Breach", p:["He ignored three complaints, and had no safety check for years. That falls below the standard of a reasonable landlord."]},
    {h:"4. Causation", p:["But for the failure to repair, would Nina have died? Apply the but-for test and operating and substantial cause. Her carbon monoxide poisoning came from the boiler he failed to fix, so likely met."]},
    {h:"5. Gross negligence", p:["Was the breach so bad as to be criminal (Lord Mackay)? He had warnings (dizziness, fumes) and did nothing.","Was the risk a serious and obvious risk of death (Misra and Srivastava; Rose)? Carbon monoxide risk is well known. Argue yes."]},
    {h:"6. The company", p:["Ed Lets Ltd cannot be convicted of common-law GNM. Corporate manslaughter (CMCHA 2007 s 1): the company must owe a duty of care (s 2(1)), and the death must be caused by a gross breach, with the way senior management organised the activity being a substantial element (s 1(4)).","Liability does not depend on convicting an individual director. Ed and his brother are directors, so the senior management test is likely met."]},
    {h:"7. Conclude", p:["Ed is likely guilty of GNM. The company is exposed to corporate manslaughter. Keep the two separate."]}
  ]
},
{
  id:"pq11", t:"im", title:"Depression and drink", tags:["Diminished responsibility","Alcohol dependency","Dietschmann","Tandy"],
  facts:"Fay has been treated for severe depression for several years and also drinks heavily every day. After an argument she stabs her partner with a kitchen knife, intending to injure him seriously. He dies. She had drunk a bottle of vodka that day. A psychiatrist will say that her depression substantially affected her judgement. She is charged with murder. Advise.",
  task:"Start by saying why she has the murder mens rea, then work through the defence.",
  steps:[
    {h:"1. Murder", p:["Unlawful killing with intent to kill or cause GBH. She intended to injure seriously, so she has the murder mens rea. Her best route to a lesser verdict is diminished responsibility."]},
    {h:"2. Set up the defence", p:["HA 1957 s 2(1) as amended by CJA 2009 s 52. Partial defence to murder only. Burden on Fay to prove it on the balance of probabilities (s 2(2); Dunbar). Success gives manslaughter (s 2(3))."]},
    {h:"3. The four elements", p:["Abnormality of mental functioning: Byrne. Severe depression, backed by psychiatric evidence (Dix).","Recognised medical condition: depression is, and pre-2010 cases accepted it (Ahluwalia).","Substantial impairment: of understanding, rational judgment or self-control. Less than total, more than trivial (Golds). A jury question.","Explanation: it caused or was a significant contributory factor (s 2(1B))."]},
    {h:"4. The alcohol", p:["Ordinary intoxication cannot found the defence (Fenton).","Genuine abnormality plus drink: the jury disregards the drink and asks whether the abnormality alone substantially impaired her (Gittens; Dietschmann). The abnormality need not be the sole cause.","Her daily drinking raises alcohol dependency. ADS can qualify if drinking was involuntary (Tandy: failed because the first drink was voluntary; Wood; Stewart). Say this is a second, separate route and a jury question."]},
    {h:"5. Conclude", p:["Fay’s depression gives a real prospect of diminished responsibility, but the burden is hers, the evidence must come from psychiatrists, and the vodka will be disregarded. If she succeeds, the conviction is manslaughter and the judge has discretion on sentence."]}
  ]
}
);
